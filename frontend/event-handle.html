<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>처리 기록 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    .main { grid-template-rows: auto minmax(0, 1fr); }
    .results { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .results .tc-card strong { font-size: 16px; }
    .results .ok-card { border-left-color: var(--green); }
    .results .no-card { border-left-color: #8e9aab; }
    .results .act-card { border-left-color: var(--red); }
    .drop { display: grid; place-items: center; height: 76px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.18); color: var(--muted); font-size: 13px; font-weight: 700; }
    .log { display: grid; gap: 0; }
    .log div { display: grid; grid-template-columns: 70px 14px minmax(0, 1fr); gap: 10px; padding: 8px 0; font-size: 13px; }
    .log time { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
    .log i { width: 10px; height: 10px; margin-top: 4px; border-radius: 50%; background: var(--blue); }
    .log small { display: block; color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>
  <div class="page">
    <aside class="cell left">
      <div class="pad">
        <div class="label">처리할 이벤트 <span>미처리 · 확인중</span></div>
        <div id="queue" style="display:grid; gap:8px"></div>
        <div class="hint">처리를 마친 이벤트는 이 목록에서 빠지고, <b>이벤트 목록</b>에서 처리완료로 보입니다.</div>
      </div>
    </aside>

    <header class="cell head"></header>

    <main class="main">
      <section class="cell">
        <div class="pad" id="work">
          <div class="row between"><div class="label" id="work-title">이벤트를 고르세요</div><div id="work-status"></div></div>

          <div id="ack-row" class="row" hidden>
            <button class="btn primary" id="ack">👀 확인 시작</button>
            <span class="muted">누가 이 이벤트를 보고 있는지 남깁니다 (미처리 → 확인중)</span>
          </div>

          <div class="field" id="checks-field">해제 전에 허가할 항목 <span class="muted" id="check-count"></span>
            <div id="checks" style="display:grid; gap:8px"></div>
          </div>

          <div class="field" id="result-field">처리 결과
            <div class="results" id="results">
              <button class="tc-card ok-card" data-action="RESOLVE"><div class="code">확인 완료</div><strong>실제 위험 · 조치 끝</strong><p>현장에서 조치를 마쳤어요</p></button>
              <button class="tc-card no-card" data-action="FALSE_ALARM"><div class="code">오탐</div><strong>잘못 탐지됨</strong><p>위험이 아니었어요</p></button>
              <button class="tc-card act-card" data-action="ESCALATE"><div class="code">조치 필요</div><strong>아직 위험</strong><p>기록만 남기고 계속 확인중</p></button>
            </div>
          </div>
          <label class="field">조치 내용 · 메모<textarea class="input" id="memo" placeholder="예: 인양 중지 후 신호수 1명 배치, 14:40 인양 재개"></textarea></label>
          <div class="row end">
            <a class="btn" id="back" href="event-detail.html">상세 화면</a>
            <button class="btn primary" id="save">저장</button>
          </div>
        </div>
      </section>
      <section class="cell" style="overflow:auto">
        <div class="pad">
          <div class="label">이 이벤트의 처리 이력</div>
          <div class="log" id="log"></div>
        </div>
      </section>
    </main>

    <aside class="cell right">
      <div class="pad">
        <div class="label">이벤트 요약</div>
        <a class="cell cam" id="summary-cam" href="event-detail.html" style="height:170px; display:block">
          <div class="scene" id="summary-scene"><div class="ground-line"></div><div class="mast" style="left:48%; height:64%;"></div><div class="jib" style="left:48%; top:18%; width:34%;"></div><div class="box stop" style="left:58%; top:34%; width:16%; height:36%;"><em id="summary-box"></em></div></div>
          <div class="cam-tag" id="summary-tag"></div>
        </a>
        <div id="summary"></div>
        <a class="btn block" id="detail-link" href="event-detail.html">상세 화면 다시 보기</a>
      </div>
    </aside>
  </div>
  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    requireLogin();
    const $ = (id) => document.getElementById(id);
    const canHandle = getAuth() && getAuth().user.role !== "VIEWER";
    const ACTION = {
      ACK: ["", "확인 시작", "상태: 미처리 → 확인중"],
      NOTE: ["", "메모", ""],
      ESCALATE: ["var(--red)", "조치 필요", "아직 위험 · 계속 확인중"],
      PERMIT: ["var(--green)", "항목 허가", ""],
      REVOKE: ["var(--amber)", "허가 취소", ""],
      RESOLVE: ["var(--green)", "처리 완료", "상태: 처리완료"],
      FALSE_ALARM: ["#8e9aab", "오탐 처리", "상태: 오탐"],
    };
    let ev = null, pick = null;

    async function loadQueue() {
      const open = await api("/api/events", { query: { status: ["NEW", "ACK"], size: 50 } });
      $("queue").innerHTML = open.items.length ? open.items.map((x) => `
        <button class="tc-card${ev && x.id === ev.id ? " active" : ""}" data-id="${x.id}">
          <div class="code">EV-${x.id} · ${fmtTime(x.detected_at, { date: false }).slice(0, 5)}</div>
          <strong>${esc(x.detection_label)} ${badge("eventStatus", x.status)}</strong>
          <p>${esc(x.camera_name || "-")} · ${esc(x.work_zone_name || "-")}</p></button>`).join("")
        : '<p class="muted">처리할 이벤트가 없습니다 👍</p>';
      return open.items;
    }

    async function openEvent(id) {
      ev = await api(`/api/events/${id}`);
      pick = null;
      history.replaceState(null, "", "?id=" + id);
      render();
      await loadQueue();
    }

    function render() {
      const closed = ev.status === "DONE" || ev.status === "FALSE";
      const editable = canHandle && !closed;
      $("work-title").textContent = `EV-${ev.id} ${ev.detection_label} 처리`;
      $("work-status").innerHTML = badge("eventStatus", ev.status);
      $("ack-row").hidden = !(canHandle && ev.status === "NEW");

      // 해제 항목: 하나씩 허가해야 처리완료(RESOLVE)를 누를 수 있다
      const done = ev.check_items.filter((c) => c.permitted).length;
      $("checks-field").hidden = !ev.check_items.length;
      $("check-count").textContent = `${done} / ${ev.check_items.length} 허가`;
      $("checks").innerHTML = ev.check_items.map((c) => `
        <div class="check ${c.permitted ? "ok" : "stop"}"><div><b>${esc(c.title)}</b><small>${c.permitted ? "허가됨" : "아직 허가 안 됨"}</small></div>
          ${editable ? `<button class="btn sm${c.permitted ? "" : " primary"}" data-item="${c.id}" data-act="${c.permitted ? "REVOKE" : "PERMIT"}">${c.permitted ? "허가 취소" : "허가"}</button>`
            : `<span class="status ${c.permitted ? "ok" : "stop"}">${c.permitted ? "✓" : "대기"}</span>`}</div>`).join("");

      const missing = ev.check_items.length - done;
      $("result-field").hidden = !editable;
      document.querySelectorAll("#results [data-action]").forEach((b) => {
        b.classList.toggle("active", b.dataset.action === pick);
        const blocked = b.dataset.action === "RESOLVE" && missing > 0;
        b.disabled = blocked;
        b.style.opacity = blocked ? 0.45 : 1;
        b.title = blocked ? `허가하지 않은 항목이 ${missing}개 남았습니다` : "";
      });
      $("memo").placeholder = closed ? "끝난 이벤트에는 메모만 남길 수 있습니다" : "예: 인양 중지 후 신호수 1명 배치, 14:40 인양 재개";
      $("memo").disabled = !canHandle;
      $("save").disabled = !canHandle;
      $("save").textContent = closed ? "메모 남기기" : "저장";
      ["back", "detail-link", "summary-cam"].forEach((k) => { $(k).href = "event-detail.html?id=" + ev.id; });

      // 처리 이력: 발생 → 처리 기록 시간순
      const items = Object.fromEntries(ev.check_items.map((c) => [c.id, c.title]));
      const conf = ev.confidence == null ? "" : ` ${Math.round(ev.confidence * 100)}%`;
      $("log").innerHTML = `<div><time>${fmtTime(ev.detected_at, { date: false })}</time><i style="background:var(--red)"></i><span>이벤트 발생<small>${esc(ev.camera_name || "카메라 없음")} ${esc(ev.detection_label)}${conf} · 자동 탐지</small></span></div>`
        + ev.actions.map((a) => {
          const [color, label, sub] = ACTION[a.action_type];
          const detail = [a.check_item_id ? items[a.check_item_id] : "", sub, a.memo].filter(Boolean).map(esc).join(" · ");
          return `<div><time>${fmtTime(a.created_at, { date: false })}</time><i${color ? ` style="background:${color}"` : ""}></i><span>${esc(a.user_name)} ${label}${detail ? `<small>${detail}</small>` : ""}</span></div>`;
        }).join("");

      // 오른쪽 요약
      const [cls, sev] = LABEL.severity[ev.severity];
      $("summary-scene").className = "scene " + { HIGH: "red", MEDIUM: "", LOW: "green" }[ev.severity];
      $("summary-box").textContent = ev.detection_label;
      $("summary-tag").textContent = ev.camera_name || "카메라 없음";
      $("summary").innerHTML = `<div class="check ${cls}"><div><b>${esc(ev.detection_label)}</b><small>${fmtTime(ev.detected_at)} · ${esc(ev.work_zone_name || "-")}</small></div><span class="status ${cls}">${sev}</span></div>`
        + `<div class="check info"><div><b>신뢰도</b><small>모델 확신 정도</small></div><span class="status info">${ev.confidence == null ? "-" : Math.round(ev.confidence * 100) + "%"}</span></div>`;
    }

    async function act(action_type, extra = {}) {
      try {
        ev = await api(`/api/events/${ev.id}/actions`, { method: "POST", body: { action_type, ...extra } });
        return true;
      } catch (err) {
        toast(err.message);
        return false;
      }
    }

    $("queue").addEventListener("click", (e) => {
      const b = e.target.closest("[data-id]");
      if (b) openEvent(Number(b.dataset.id)).catch((err) => toast(err.message));
    });
    $("ack").addEventListener("click", async () => {
      if (await act("ACK")) { render(); loadQueue(); }
    });
    $("checks").addEventListener("click", async (e) => {
      const b = e.target.closest("[data-item]");
      if (b && await act(b.dataset.act, { check_item_id: Number(b.dataset.item) })) { render(); loadQueue(); }
    });
    $("results").addEventListener("click", (e) => {
      const b = e.target.closest("[data-action]");
      if (b && !b.disabled) { pick = pick === b.dataset.action ? null : b.dataset.action; render(); }
    });
    $("save").addEventListener("click", async () => {
      const memo = $("memo").value.trim() || null;
      const closed = ev.status === "DONE" || ev.status === "FALSE";
      const type = closed ? "NOTE" : pick || "NOTE";
      if (type === "NOTE" && !memo) return toast(closed ? "남길 메모를 적으세요." : "처리 결과를 고르거나 메모를 적으세요.");
      if (await act(type, { memo })) {
        $("memo").value = "";
        pick = null;
        toast(type === "RESOLVE" ? "처리완료했습니다." : type === "FALSE_ALARM" ? "오탐으로 처리했습니다." : "처리 기록을 저장했습니다.");
        render();
        loadQueue();
      }
    });

    (async () => {
      const id = Number(new URLSearchParams(location.search).get("id"));
      const queue = await loadQueue();
      if (id || queue.length) await openEvent(id || queue[0].id);
      else $("work").innerHTML = '<p class="muted">처리할 이벤트가 없습니다. <a href="events.html">이벤트 목록</a>에서 지난 이벤트를 볼 수 있습니다.</p>';
    })().catch((err) => toast(err.message));
  </script>
</body>
</html>
