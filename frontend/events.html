<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>이벤트 목록 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    .main { grid-template-rows: auto minmax(0, 1fr); }
    .bar-top { padding: 12px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; overflow: hidden; }
    .tbl-wrap { padding: 0 6px 6px; }
  </style>
</head>
<body>
  <div class="page no-right">
    <aside class="cell left">
      <form class="pad" id="filter">
        <div class="label">검색 조건</div>
        <label class="field">날짜<input class="input" type="date" id="f-date" /></label>
        <label class="field">구역
          <select class="input" id="f-zone"><option value="">전체 구역</option></select>
        </label>
        <div class="field">이벤트 종류
          <div class="chips" id="f-type"></div>
        </div>
        <div class="field">심각도
          <div class="chips" id="f-severity"><span class="chip on" data-v="HIGH">높음</span><span class="chip on" data-v="MEDIUM">중간</span><span class="chip on" data-v="LOW">낮음</span></div>
        </div>
        <div class="field">처리 상태
          <div class="chips" id="f-status"><span class="chip on" data-v="NEW">미처리</span><span class="chip on" data-v="ACK">확인중</span><span class="chip on" data-v="DONE">처리완료</span><span class="chip" data-v="FALSE">오탐</span></div>
        </div>
        <div class="row">
          <button class="btn primary grow">검색</button>
          <button class="btn" type="button" id="reset">초기화</button>
        </div>
      </form>
    </aside>

    <header class="cell head"></header>

    <main class="main">
      <section class="cell bar-top">
        <b id="count">불러오는 중…</b><span class="muted" id="summary">줄을 누르면 상세 화면으로 이동</span>
        <span class="grow"></span>
        <select class="input" id="sort" style="width:150px"><option value="latest">최신순</option><option value="severity">심각도 높은 순</option><option value="confidence">신뢰도 높은 순</option></select>
        <a class="btn" href="event-snapshot.html">🖼 스냅샷으로 보기</a>
        <a class="btn primary" href="event-export.html">⬇ CSV 내보내기</a>
      </section>
      <section class="cell tbl-wrap">
        <table class="tbl">
          <thead><tr><th>번호</th><th>시각</th><th>카메라</th><th>구역</th><th>종류</th><th>심각도</th><th>신뢰도</th><th>처리 상태</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="pagers" id="pagers"></div>
      </section>
    </main>
  </div>
  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    requireLogin();
    const $ = (id) => document.getElementById(id);
    const SIZE = 10;
    const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    const picked = (box) => [...$(box).querySelectorAll(".chip.on")].map((c) => c.dataset.v);
    const toggleChip = (e) => { if (e.target.classList.contains("chip")) e.target.classList.toggle("on"); };
    let page = 1;

    async function loadOptions() {
      const [zones, types] = await Promise.all([api("/api/work-zones"), api("/api/detection-types")]);
      $("f-zone").insertAdjacentHTML("beforeend", zones.map((z) => `<option value="${z.id}">${esc(z.name)}</option>`).join(""));
      $("f-type").innerHTML = types.map((t) => `<span class="chip on" data-v="${t.code}">${esc(t.label)}</span>`).join("");
    }

    async function load() {
      const types = picked("f-type"), sev = picked("f-severity"), st = picked("f-status");
      if (!types.length || !sev.length || !st.length) return render({ total: 0, items: [] });
      const date = $("f-date").value;
      const data = await api("/api/events", { query: {
        date_from: date, date_to: date, work_zone_id: $("f-zone").value,
        detection_type: types, severity: sev, status: st,
        sort: $("sort").value, page, size: SIZE,
      } });
      render(data);
    }

    function render({ total, items }) {
      $("count").textContent = `검색 결과 ${total}건`;
      const zone = $("f-zone").selectedOptions[0].textContent;
      $("summary").textContent = `${($("f-date").value || "전체 기간").replaceAll("-", ".")} · ${zone} · 줄을 누르면 상세 화면으로 이동`;
      $("rows").innerHTML = items.length ? items.map((e) => {
        const time = fmtTime(e.detected_at, { date: false });
        const conf = e.confidence == null ? "-" : Math.round(e.confidence * 100) + "%";
        return `<tr data-href="event-detail.html?id=${e.id}"><td class="num">EV-${e.id}</td><td class="num">${time}</td>
          <td>${esc(e.camera_name || "-")}</td><td>${esc(e.work_zone_name || "-")}</td><td>${esc(e.detection_label)}</td>
          <td>${badge("severity", e.severity)}</td><td class="num">${conf}</td><td>${badge("eventStatus", e.status)}</td></tr>`;
      }).join("") : `<tr><td colspan="8" class="muted" style="text-align:center; padding:28px">조건에 맞는 이벤트가 없습니다</td></tr>`;
      $("rows").querySelectorAll("[data-href]").forEach((tr) => tr.addEventListener("click", () => { location.href = tr.dataset.href; }));

      const pages = Math.max(1, Math.ceil(total / SIZE));
      $("pagers").innerHTML = Array.from({ length: pages }, (_, i) =>
        `<span class="pager${i + 1 === page ? " on" : ""}" data-p="${i + 1}">${i + 1}</span>`).join("");
    }

    const search = () => { page = 1; load().catch((err) => toast(err.message)); };
    $("filter").addEventListener("submit", (e) => { e.preventDefault(); search(); });
    $("sort").addEventListener("change", search);
    $("f-type").addEventListener("click", toggleChip); // 심각도 · 상태 칩은 common.js 가 켜고 끈다 (종류 칩은 나중에 그려서 직접)
    $("pagers").addEventListener("click", (e) => {
      if (!e.target.dataset.p) return;
      page = Number(e.target.dataset.p);
      load().catch((err) => toast(err.message));
    });
    $("reset").addEventListener("click", () => {
      $("f-date").value = today();
      $("f-zone").value = "";
      document.querySelectorAll("#filter .chip").forEach((c) => c.classList.toggle("on", c.dataset.v !== "FALSE"));
      search();
    });

    $("f-date").value = today();
    loadOptions().then(load).catch((err) => toast(err.message));
  </script>
</body>
</html>
