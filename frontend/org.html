<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>조직 · 부서 관리 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    .main { grid-template-rows: auto minmax(0, 1fr); }
    .tree { display: grid; gap: 2px; }
    .node { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: #c5d0dc; font: inherit; font-size: 13px; font-weight: 600; text-align: left; cursor: pointer; }
    .node:hover { background: var(--panel-2); }
    .node.on { background: rgba(255, 154, 31, 0.12); border-color: rgba(255, 154, 31, 0.6); color: var(--ink); }
    .node .n { margin-left: auto; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
    .node.l0 { font-weight: 800; color: var(--ink); }
    .node.l1 { padding-left: 26px; }
    .node.l2 { padding-left: 44px; }
    .node .k { font-size: 10.5px; font-weight: 800; padding: 1px 6px; border-radius: 5px; background: #243044; color: var(--muted); }
    .node .k.main { background: rgba(255, 154, 31, 0.18); color: var(--orange); }
    .org-info { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 14px 16px; }
    .org-info div span { display: block; font-size: 11.5px; color: var(--muted); font-weight: 700; }
    .org-info div b { font-size: 15px; }
    @media (max-width: 1100px) { .org-info { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="page">
    <aside class="cell left">
      <div class="pad">
        <div class="label">조직도 <span>organization</span></div>
        <div class="tree" id="tree"></div>
        <div class="row">
          <button class="btn sm" id="add-dept">＋ 하위 부서</button>
          <button class="btn sm" id="add-co">＋ 협력사</button>
        </div>
      </div>
    </aside>

    <header class="cell head"></header>

    <main class="main">
      <section class="cell">
        <div class="org-info">
          <div><span>선택한 조직</span><b id="i-name">-</b></div>
          <div><span>상위 조직</span><b id="i-parent">-</b></div>
          <div><span>구분</span><b id="i-type">-</b></div>
          <div><span>소속 회원</span><b id="i-count">0명</b></div>
        </div>
      </section>
      <section class="cell"><form class="pad" id="form">
        <div class="row between">
          <div class="label">이 조직 정보 바꾸기</div>
          <div class="row"><button class="btn sm" type="button" id="del">삭제</button><button class="btn sm primary">저장</button></div>
        </div>
        <div class="two">
          <label class="field">이름<input class="input" id="f-name" required maxlength="100" /></label>
          <label class="field">상위 조직<select class="input" id="f-parent"></select></label>
        </div>
        <div class="label" style="margin-top:6px">소속 회원 <span>회원정보 수정에서 소속을 바꿀 수 있습니다</span></div>
        <table class="tbl">
          <thead><tr><th>이름</th><th>아이디</th><th>역할</th><th>상태</th></tr></thead>
          <tbody id="members"></tbody>
        </table>
      </form></section>
    </main>

    <aside class="cell right">
      <div class="pad">
        <div class="label">구조 규칙</div>
        <div class="check info"><div><b>원청 · 협력사</b><small>회사 단위 (type = COMPANY)</small></div><span class="status info">최상위</span></div>
        <div class="check info"><div><b>부서</b><small>회사 아래 최대 2단계 (type = DEPT)</small></div><span class="status info">parent_id</span></div>
        <div class="check warn"><div><b>삭제</b><small>하위 부서나 소속 회원이 있으면 지울 수 없음</small></div><span class="status warn">!</span></div>
        <div class="hint">협력사 작업자는 회원이 아니라 <b>현장작업자</b>로 따로 관리합니다. 여기의 협력사는 협력사 소속 <b>회원</b>(안전담당 등)을 위한 조직입니다.</div>
      </div>
    </aside>
  </div>

  <div class="pop" id="add-pop" hidden>
    <div class="pop-card">
      <div class="pop-head">
        <div><span class="role" id="a-tag">새 조직</span><h2 id="a-title">조직 · 부서 추가</h2><p id="a-help"></p></div>
        <button class="btn sm" data-close>닫기</button>
      </div>
      <form class="pop-body" id="add-form">
        <label class="field">이름<input class="input" id="a-name" required maxlength="100" placeholder="예: 품질팀" /></label>
        <label class="field" id="a-parent-box">상위 조직<select class="input" id="a-parent"></select></label>
        <div class="row end"><button class="btn" type="button" data-close>취소</button><button class="btn primary">추가</button></div>
      </form>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    requireLogin();
    const $ = (id) => document.getElementById(id);
    let orgs = [], users = [], names = {}, sel = null, addType = "DEPT";

    const depth = (o) => (o.parent_id ? 1 + depth(orgs.find((x) => x.id === o.parent_id)) : 0);
    const children = (id) => orgs.filter((o) => o.parent_id === id);
    const members = (id) => users.filter((u) => u.org_id === id && u.status !== "DELETED");
    // 회사 → 부서 → 하위 부서 순서로 펼친 목록
    const ordered = () => {
      const out = [];
      const walk = (o) => { out.push(o); children(o.id).forEach(walk); };
      orgs.filter((o) => !o.parent_id).forEach(walk);
      return out;
    };
    // 이 조직 아래 전체 (자기 포함) 회원 수
    const total = (o) => members(o.id).length + children(o.id).reduce((a, c) => a + total(c), 0);

    async function load(selectId) {
      [orgs, users] = await Promise.all([api("/api/orgs"), api("/api/users")]);
      names = orgNames(orgs);
      $("tree").innerHTML = ordered().map((o) => `
        <button class="node l${depth(o)}" data-id="${o.id}">${o.type === "COMPANY" ? `<span class="k${o.is_prime ? " main" : ""}">${o.is_prime ? "원청" : "협력사"}</span>` : ""}${esc(o.name)}<span class="n">${total(o)}</span></button>`).join("");
      show(selectId || (sel && sel.id) || (orgs[0] && orgs[0].id));
    }

    function show(id) {
      sel = orgs.find((o) => o.id === id) || orgs[0];
      if (!sel) return;
      document.querySelectorAll(".node").forEach((n) => n.classList.toggle("on", Number(n.dataset.id) === sel.id));
      const parent = orgs.find((o) => o.id === sel.parent_id);
      $("i-name").textContent = sel.name;
      $("i-parent").textContent = parent ? names[parent.id] : "(없음 · 최상위)";
      $("i-type").textContent = sel.type === "COMPANY" ? (sel.is_prime ? "COMPANY (원청)" : "COMPANY (협력사)") : "DEPT (부서)";
      $("i-count").textContent = members(sel.id).length + "명";
      $("f-name").value = sel.name;
      // 부서는 회사나 1단계 부서 아래로만 옮길 수 있다 (자기 자신 · 하위 제외)
      const below = new Set();
      const mark = (o) => { below.add(o.id); children(o.id).forEach(mark); };
      mark(sel);
      const canParent = orgs.filter((o) => !below.has(o.id) && depth(o) < (children(sel.id).length ? 1 : 2));
      $("f-parent").innerHTML = sel.type === "COMPANY"
        ? '<option value="">(없음 · 최상위)</option>'
        : canParent.map((o) => `<option value="${o.id}"${o.id === sel.parent_id ? " selected" : ""}>${esc(names[o.id])}</option>`).join("");
      $("f-parent").disabled = sel.type === "COMPANY";
      $("members").innerHTML = members(sel.id).map((u) => `
        <tr data-href="user-edit.html?id=${u.id}" style="cursor:pointer"><td><b>${esc(u.name)} ${esc(u.position || "")}</b></td><td>${esc(u.login_id)}</td>
          <td>${badge("role", u.role)}</td><td>${badge("userStatus", u.status)}</td></tr>`).join("")
        || '<tr><td colspan="4" class="muted" style="text-align:center; padding:20px">소속 회원이 없습니다</td></tr>';
      $("members").querySelectorAll("tr[data-href]").forEach((tr) => tr.addEventListener("click", () => { location.href = tr.dataset.href; }));
    }

    function openAdd(type) {
      addType = type;
      $("a-tag").textContent = type === "COMPANY" ? "새 협력사" : "새 부서";
      $("a-title").textContent = type === "COMPANY" ? "협력사 추가" : "하위 부서 추가";
      $("a-help").textContent = type === "COMPANY" ? "회사는 최상위 조직으로 만들어집니다" : "회사 아래 최대 2단계까지 만들 수 있습니다";
      $("a-parent-box").hidden = type === "COMPANY";
      $("a-parent").innerHTML = orgs.filter((o) => depth(o) < 2)
        .map((o) => `<option value="${o.id}"${sel && o.id === sel.id ? " selected" : ""}>${esc(names[o.id])}</option>`).join("");
      $("a-name").value = "";
      $("add-pop").hidden = false;
      $("a-name").focus();
    }

    $("tree").addEventListener("click", (e) => { const n = e.target.closest(".node"); if (n) show(Number(n.dataset.id)); });
    $("add-dept").addEventListener("click", () => openAdd("DEPT"));
    $("add-co").addEventListener("click", () => openAdd("COMPANY"));
    $("add-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const o = await api("/api/orgs", { method: "POST", body: {
          type: addType, name: $("a-name").value.trim(), parent_id: addType === "COMPANY" ? null : Number($("a-parent").value),
        } });
        $("add-pop").hidden = true;
        toast(`${o.name}을(를) 추가했습니다.`);
        await load(o.id);
      } catch (err) { toast(err.message); }
    });
    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = { name: $("f-name").value.trim() };
      if (sel.type === "DEPT") body.parent_id = Number($("f-parent").value);
      try {
        await api(`/api/orgs/${sel.id}`, { method: "PATCH", body });
        toast("조직 정보를 저장했습니다.");
        await load(sel.id);
      } catch (err) { toast(err.message); }
    });
    $("del").addEventListener("click", async () => {
      if (!confirm(`${sel.name}을(를) 삭제할까요?`)) return;
      try {
        await api(`/api/orgs/${sel.id}`, { method: "DELETE" });
        toast("삭제했습니다.");
        sel = null;
        await load(null);
      } catch (err) { toast(err.message); }
    });

    load(null).catch((err) => toast(err.message));
  </script>
</body>
</html>
