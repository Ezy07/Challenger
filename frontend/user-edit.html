<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>회원정보 수정 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    .main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .roles { display: grid; gap: 8px; }
    .roles label { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: start; padding: 11px 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); cursor: pointer; }
    .roles label:has(input:checked) { border-color: var(--orange); background: rgba(255, 154, 31, 0.08); }
    .roles input { grid-row: span 2; margin-top: 3px; }
    .roles b { font-size: 14px; }
    .roles small { color: var(--muted); font-size: 12px; }
    .perm th:not(:first-child), .perm td:not(:first-child) { text-align: center; }
    .perm td:first-child { color: #c5d0dc; font-weight: 600; }
    .perm .yes { color: var(--green); font-weight: 800; }
    .perm .no { color: #4a5566; }
    .perm .part { color: var(--amber); font-weight: 800; }
    .perm col.on { background: rgba(255, 154, 31, 0.08); }
    .who { display: flex; align-items: center; gap: 12px; }
    .who .av { width: 46px; height: 46px; border-radius: 50%; background: #243044; display: grid; place-items: center; font-weight: 800; font-size: 18px; }
    .who b { font-size: 17px; }
    .who small { display: block; color: var(--muted); font-size: 12px; }
    @media (max-width: 1100px) { .main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="page no-right">
    <aside class="cell left">
      <div class="pad">
        <div class="label">회원 고르기 <span id="n-users">0명</span></div>
        <div id="pick" style="display:grid; gap:8px"></div>
      </div>
    </aside>

    <header class="cell head"></header>

    <main class="main scroll">
      <section class="cell"><div class="pad">
        <div class="who"><span class="av" id="ue-av"></span><div><b id="ue-title">불러오는 중…</b><small id="ue-sub"></small></div></div>
        <div class="label" style="margin-top:6px">기본 정보</div>
        <div class="two">
          <label class="field">이름<input class="input" id="ue-name" /></label>
          <label class="field">직급<input class="input" id="ue-rank" /></label>
        </div>
        <label class="field">휴대폰<input class="input" id="ue-phone" placeholder="010-0000-0000" /></label>
        <label class="field">소속 (조직 · 부서)<select class="input" id="ue-org"></select></label>
        <div class="label" style="margin-top:6px">계정 상태 <span id="self-note"></span></div>
        <div class="chips" id="ue-status">
          <span class="chip" data-v="ACTIVE">활성</span><span class="chip" data-v="LOCKED">잠금</span>
        </div>
        <div class="row">
          <button class="btn sm" id="reset-pw">비밀번호 초기화</button>
          <span class="muted" id="ue-login"></span>
        </div>
      </div></section>

      <section class="cell"><div class="pad">
        <div class="label">역할 (권한) <span>role</span></div>
        <div class="roles" id="roles">
          <label><input type="radio" name="role" value="ADMIN" /><b>관리자 (ADMIN)</b><small>모든 화면 + 관리자 메뉴(회원 · 카메라 · 알림 규칙)</small></label>
          <label><input type="radio" name="role" value="MANAGER" /><b>안전관리자 (MANAGER)</b><small>관제 · 이벤트 처리 · ROI · 안전관리 업무</small></label>
          <label><input type="radio" name="role" value="VIEWER" /><b>조회 전용 (VIEWER)</b><small>화면 보기만, 저장 · 처리 불가</small></label>
        </div>
        <div class="label" style="margin-top:6px">역할별 메뉴 권한 <span>● 가능 · ◐ 보기만 · – 안 보임</span></div>
        <div style="overflow-x:auto">
          <table class="tbl perm">
            <colgroup><col /><col id="c-ADMIN" /><col id="c-MANAGER" /><col id="c-VIEWER" /></colgroup>
            <thead><tr><th>메뉴</th><th>관리자</th><th>안전관리자</th><th>조회 전용</th></tr></thead>
            <tbody>
              <tr><td>관제화면 · 알림 확인</td><td class="yes">●</td><td class="yes">●</td><td class="part">◐</td></tr>
              <tr><td>구역 및 작업</td><td class="yes">●</td><td class="yes">●</td><td class="part">◐</td></tr>
              <tr><td>이벤트 처리 기록</td><td class="yes">●</td><td class="yes">●</td><td class="part">◐</td></tr>
              <tr><td>통계 · 리포트</td><td class="yes">●</td><td class="yes">●</td><td class="part">◐</td></tr>
              <tr><td>ROI 그리기 · 규칙</td><td class="yes">●</td><td class="yes">●</td><td class="no">–</td></tr>
              <tr><td>안전관리 업무</td><td class="yes">●</td><td class="yes">●</td><td class="no">–</td></tr>
              <tr><td>관리자 메뉴</td><td class="yes">●</td><td class="no">–</td><td class="no">–</td></tr>
            </tbody>
          </table>
        </div>
        <div class="row end" style="margin-top:4px">
          <a class="btn" href="users.html">취소</a>
          <button class="btn primary" id="save">저장</button>
        </div>
      </div></section>
    </main>
  </div>

  <div class="pop" id="pw-pop" hidden>
    <div class="pop-card">
      <div class="pop-head">
        <div><span class="status ok">초기화 완료</span><h2 id="pw-title">임시 비밀번호</h2><p>이 창을 닫으면 다시 볼 수 없습니다. 본인에게 전달하고 로그인 후 바꾸도록 안내하세요. 잠긴 계정이었다면 잠금도 풀렸습니다.</p></div>
      </div>
      <div class="pop-body">
        <div class="input" id="pw-value" style="font-family:Consolas,monospace; font-size:18px; user-select:all"></div>
        <div class="row end"><button class="btn primary" data-close>확인</button></div>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    requireLogin();
    const $ = (id) => document.getElementById(id);
    const me = getAuth() && getAuth().user;
    let users = [], orgs = {}, user = null;

    async function load(id) {
      const [list, orgList] = await Promise.all([api("/api/users"), api("/api/orgs")]);
      users = list.filter((u) => u.status === "ACTIVE" || u.status === "LOCKED");
      orgs = orgNames(orgList);
      $("ue-org").innerHTML = '<option value="">소속 없음</option>' +
        orgList.map((o) => `<option value="${o.id}">${esc(orgs[o.id])}</option>`).join("");
      $("n-users").textContent = users.length + "명";
      show(users.find((u) => u.id === id) || users[0]);
    }

    function show(u) {
      user = u;
      if (!u) return;
      history.replaceState(null, "", "?id=" + u.id);
      $("pick").innerHTML = users.map((x) => `
        <button class="tc-card${x.id === u.id ? " active" : ""}" data-id="${x.id}">
          <div class="code">${LABEL.role[x.role][1]}${x.status === "LOCKED" ? " · 잠금" : ""}</div>
          <strong>${esc(x.name)} ${esc(x.position || "")}</strong><p>${esc(orgs[x.org_id] || "소속 없음")}</p></button>`).join("");

      const by = users.find((x) => x.id === u.approved_by);
      $("ue-av").textContent = u.name[0];
      $("ue-title").textContent = `${u.name} ${u.position || ""}`;
      $("ue-sub").textContent = [u.login_id, "가입 " + fmtTime(u.created_at, { time: false }), by ? "승인 " + by.name : ""].filter(Boolean).join(" · ");
      $("ue-name").value = u.name;
      $("ue-rank").value = u.position || "";
      $("ue-phone").value = u.phone || "";
      $("ue-org").value = u.org_id || "";
      $("ue-login").textContent = `마지막 접속 ${u.last_login_at ? fmtTime(u.last_login_at).slice(0, 16) : "없음"} · 비밀번호 실패 ${u.failed_login_count}회`;
      document.querySelectorAll("#ue-status .chip").forEach((c) => c.classList.toggle("on", c.dataset.v === u.status));
      document.querySelector(`input[name=role][value=${u.role}]`).checked = true;

      // 자기 자신의 역할 · 상태는 바꿀 수 없다 (관리자가 한 명도 안 남는 일을 막음)
      const self = me && me.id === u.id;
      document.querySelectorAll("input[name=role]").forEach((r) => { r.disabled = self; });
      $("ue-status").style.pointerEvents = self ? "none" : "";
      $("ue-status").style.opacity = self ? 0.5 : 1;
      $("self-note").textContent = self ? "본인 계정은 역할 · 상태를 바꿀 수 없음" : "";
      mark();
    }

    // 고른 역할의 열을 표에서 강조
    function mark() {
      const v = document.querySelector("input[name=role]:checked").value;
      ["ADMIN", "MANAGER", "VIEWER"].forEach((r) => $("c-" + r).classList.toggle("on", r === v));
    }
    document.querySelectorAll("input[name=role]").forEach((r) => r.addEventListener("change", mark));

    $("ue-status").addEventListener("click", (e) => {
      if (!e.target.dataset.v) return;
      document.querySelectorAll("#ue-status .chip").forEach((c) => c.classList.toggle("on", c === e.target));
    });
    $("pick").addEventListener("click", (e) => {
      const b = e.target.closest("[data-id]");
      if (b) show(users.find((u) => u.id === Number(b.dataset.id)));
    });

    $("save").addEventListener("click", async () => {
      const body = {
        name: $("ue-name").value.trim(),
        position: $("ue-rank").value.trim() || null,
        phone: $("ue-phone").value.trim() || null,
        org_id: Number($("ue-org").value) || null,
      };
      if (!(me && me.id === user.id)) {
        body.role = document.querySelector("input[name=role]:checked").value;
        body.status = document.querySelector("#ue-status .chip.on").dataset.v;
      }
      try {
        await api(`/api/users/${user.id}`, { method: "PATCH", body });
        toast("회원정보를 저장했습니다.");
        await load(user.id);
      } catch (err) { toast(err.message); }
    });

    $("reset-pw").addEventListener("click", async () => {
      if (!confirm(`${user.name}님의 비밀번호를 초기화할까요? 지금 비밀번호는 더 이상 쓸 수 없습니다.`)) return;
      try {
        const res = await api(`/api/users/${user.id}/reset-password`, { method: "POST" });
        $("pw-title").textContent = `${res.user.name}님 (${res.user.login_id}) 임시 비밀번호`;
        $("pw-value").textContent = res.temp_password;
        $("pw-pop").hidden = false;
        await load(user.id);
      } catch (err) { toast(err.message); }
    });

    load(Number(new URLSearchParams(location.search).get("id"))).catch((err) => toast(err.message));
  </script>
</body>
</html>
