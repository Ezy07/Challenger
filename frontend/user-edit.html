<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>회원정보 수정 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    .main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .roles { display: grid; gap: 8px; }
    .roles label { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: start; padding: 11px 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); cursor: pointer; }
    .roles label:has(input:checked) { border-color: var(--orange); background: rgba(255, 154, 31, 0.08); }
    .roles input { grid-row: span 2; margin-top: 3px; }
    .roles b { font-size: 14px; }
    .roles small { color: var(--muted); font-size: 12px; }
    .perm th:not(:first-child), .perm td:not(:first-child) { text-align: center; }
    .perm td:first-child { color: #c5d0dc; font-weight: 600; }
    .perm .yes { color: var(--green); font-weight: 800; }
    .perm .no { color: #4a5566; }
    .perm .part { color: var(--amber); font-weight: 800; }
    .perm col.on { background: rgba(255, 154, 31, 0.08); }
    .who { display: flex; align-items: center; gap: 12px; }
    .who .av { width: 46px; height: 46px; border-radius: 50%; background: #243044; display: grid; place-items: center; font-weight: 800; font-size: 18px; }
    .who b { font-size: 17px; }
    .who small { display: block; color: var(--muted); font-size: 12px; }
    @media (max-width: 1100px) { .main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="page no-right">
    <aside class="cell left">
      <div class="pad" data-pick>
        <div class="label">회원 고르기 <span>7명</span></div>
        <button class="tc-card"><div class="code">관리자</div><strong>최동현 과장</strong><p>OO건설 · 안전팀</p></button>
        <button class="tc-card"><div class="code">관리자</div><strong>한지훈 소장</strong><p>OO건설 · 현장소장실</p></button>
        <button class="tc-card active"><div class="code">안전관리자</div><strong>오세영 주임</strong><p>OO건설 · 안전팀</p></button>
        <button class="tc-card"><div class="code">안전관리자</div><strong>박진우 차장</strong><p>공사팀(양중)</p></button>
        <button class="tc-card"><div class="code">안전관리자</div><strong>정민수 부장</strong><p>공사팀(토공)</p></button>
        <button class="tc-card"><div class="code">안전관리자</div><strong>김철수 과장</strong><p>공사팀(타설)</p></button>
        <button class="tc-card"><div class="code">조회 전용 · 잠금</div><strong>윤가람 주임</strong><p>OO건설 · 공무팀</p></button>
      </div>
    </aside>

    <header class="cell head"></header>

    <main class="main scroll">
      <section class="cell"><div class="pad">
        <div class="who"><span class="av">오</span><div><b>오세영 주임</b><small>oh.sy · 가입 2026.03.04 · 승인 최동현 과장</small></div></div>
        <div class="label" style="margin-top:6px">기본 정보</div>
        <div class="two">
          <label class="field">이름<input class="input" id="ue-name" value="오세영" /></label>
          <label class="field">직급<input class="input" id="ue-rank" value="주임" /></label>
        </div>
        <div class="two">
          <label class="field">휴대폰<input class="input" id="ue-phone" value="010-5523-8810" /></label>
          <label class="field">이메일<input class="input" id="ue-mail" value="oh.sy@oo-const.co.kr" /></label>
        </div>
        <label class="field">소속 (조직 · 부서)
          <select class="input" id="ue-org"><option>OO건설 · 안전팀</option><option>OO건설 · 공사팀(양중)</option><option>OO건설 · 공사팀(토공)</option><option>OO건설 · 공무팀</option><option>대한골조</option><option>한빛토건</option></select>
        </label>
        <div class="label" style="margin-top:6px">계정 상태</div>
        <div class="chips" data-single>
          <span class="chip on">활성</span><span class="chip">잠금</span>
        </div>
        <div class="row">
          <button class="btn sm" data-toast="임시 비밀번호를 문자로 보냈습니다. (예시)">비밀번호 초기화</button>
          <span class="muted">마지막 접속 오늘 14:02 · 비밀번호 실패 0회</span>
        </div>
      </div></section>

      <section class="cell"><div class="pad">
        <div class="label">역할 (권한) <span>role</span></div>
        <div class="roles" id="roles">
          <label><input type="radio" name="role" value="0" /><b>관리자 (ADMIN)</b><small>모든 화면 + 관리자 메뉴(회원 · 카메라 · 알림 규칙)</small></label>
          <label><input type="radio" name="role" value="1" checked /><b>안전관리자 (MANAGER)</b><small>관제 · 이벤트 처리 · ROI · 안전관리 업무</small></label>
          <label><input type="radio" name="role" value="2" /><b>조회 전용 (VIEWER)</b><small>화면 보기만, 저장 · 처리 불가</small></label>
        </div>
        <div class="label" style="margin-top:6px">역할별 메뉴 권한 <span>● 가능 · ◐ 보기만 · – 안 보임</span></div>
        <div style="overflow-x:auto">
          <table class="tbl perm">
            <colgroup><col /><col id="c0" /><col id="c1" /><col id="c2" /></colgroup>
            <thead><tr><th>메뉴</th><th>관리자</th><th>안전관리자</th><th>조회 전용</th></tr></thead>
            <tbody>
              <tr><td>관제화면 · 알림 확인</td><td class="yes">●</td><td class="yes">●</td><td class="part">◐</td></tr>
              <tr><td>구역 및 작업</td><td class="yes">●</td><td class="yes">●</td><td class="part">◐</td></tr>
              <tr><td>이벤트 처리 기록</td><td class="yes">●</td><td class="yes">●</td><td class="part">◐</td></tr>
              <tr><td>통계 · 리포트</td><td class="yes">●</td><td class="yes">●</td><td class="part">◐</td></tr>
              <tr><td>ROI 그리기 · 규칙</td><td class="yes">●</td><td class="yes">●</td><td class="no">–</td></tr>
              <tr><td>안전관리 업무</td><td class="yes">●</td><td class="yes">●</td><td class="no">–</td></tr>
              <tr><td>관리자 메뉴</td><td class="yes">●</td><td class="no">–</td><td class="no">–</td></tr>
            </tbody>
          </table>
        </div>
        <div class="row end" style="margin-top:4px">
          <a class="btn" href="users.html">취소</a>
          <button class="btn primary" data-toast="회원정보를 저장했습니다. (예시)">저장</button>
        </div>
      </div></section>
    </main>
  </div>
  <script src="common.js"></script>
  <script>
    // 고른 역할의 열을 표에서 강조
    const mark = () => {
      const v = document.querySelector("input[name=role]:checked").value;
      ["c0", "c1", "c2"].forEach((id, i) => document.getElementById(id).classList.toggle("on", String(i) === v));
    };
    document.querySelectorAll("input[name=role]").forEach((r) => r.addEventListener("change", mark));
    mark();
  </script>
</body>
</html>
