<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>10-1 로그인 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    body { align-items: center; justify-content: center; padding: 16px; }
    .login { width: min(400px, 100%); display: grid; gap: 14px; padding: 28px; }
    .login .brand { justify-content: center; font-size: 22px; margin: 0; }
    .login .brand i { width: 30px; height: 30px; font-size: 16px; }
    .login .site { text-align: center; color: var(--muted); font-size: 13px; margin-top: -6px; }
    .login .input { padding: 11px 12px; font-size: 14px; }
    .login .btn { padding: 12px; font-size: 15px; }
    .tag { text-align: center; font-size: 11.5px; color: var(--muted); }
    .tag b { color: var(--orange); }
  </style>
</head>
<body data-no-gnb>
  <form class="cell login" action="monitor.html">
    <div class="brand"><i>▲</i>안전관제</div>
    <div class="site">공동주택 건설현장 · OO단지 101~103동</div>
    <label class="field">아이디<input class="input" value="choi.dh" autocomplete="username" /></label>
    <label class="field">비밀번호<input class="input" type="password" value="password" autocomplete="current-password" /></label>
    <div class="row between">
      <label class="row muted" style="gap:6px; font-size:12.5px"><input type="checkbox" checked /> 아이디 기억</label>
      <a class="muted" style="font-size:12.5px" href="#" data-toast="관리자(최동현 과장)에게 비밀번호 초기화를 요청하세요.">비밀번호를 잊었어요</a>
    </div>
    <button class="btn primary">로그인</button>
    <div class="tag"><b>10-1</b> 로그인 · 예시 화면이라 아무 값이나 넣고 누르면 <a href="monitor.html"><b>1-1 멀티뷰</b></a>로 이동합니다 · <a href="index.html">페이지 지도</a></div>
  </form>
  <script src="common.js"></script>
</body>
</html>
