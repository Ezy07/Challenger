<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>ERD 요약</title><style>
.blue{--bg:#eef1fb;--bd:#c9d2f0;--fg:#3d55b8}.green{--bg:#eaf5ee;--bd:#bfdcc9;--fg:#24804a}.red{--bg:#fbeee9;--bd:#efc6b8;--fg:#c2421b}.purple{--bg:#f3eef9;--bd:#d5c6ea;--fg:#7041a8}.teal{--bg:#e8f4f5;--bd:#b8dadd;--fg:#1d7680}.slate{--bg:#edf1f5;--bd:#c8d2dc;--fg:#3f5468}
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;position:relative;background:#f6f5f2;color:#1d232b;
  font:15px/1.4 "Malgun Gothic","Noto Sans KR",sans-serif;overflow:hidden}
h1{position:absolute;left:44px;top:40px;font-size:38px;letter-spacing:-1px}
.sub{position:absolute;left:46px;top:96px;color:#5b6570;font-size:17px}
.grp{position:absolute;background:var(--bg);border:2px solid var(--bd);border-radius:18px;z-index:2}
.grp h2{color:var(--fg);font-size:27px;padding:20px 26px 0}
.chip{position:absolute;width:220px;height:64px;display:flex;align-items:center;justify-content:center;
  background:#fff;border:1.5px solid var(--bd);border-top:5px solid var(--fg);border-radius:10px;
  font-size:19px;font-weight:600;text-align:center;line-height:1.2;padding:0 10px;box-shadow:0 1px 3px #0000000d}
svg{position:absolute;left:0;top:0;z-index:1}
svg line{stroke:#8a939c;stroke-width:4}
svg circle{fill:#8a939c}
</style></head><body>
