<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0c1016" />
  <title>심각도 기준 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>
  try { if (localStorage.getItem("safety.mode") === "light") document.documentElement.dataset.mode = "light"; } catch (e) {}
  try { const z = Number(localStorage.getItem("safety.text-zoom")); if (z) document.documentElement.style.setProperty("--text-zoom", z); } catch (e) {}
  </script>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="mode_change.css" />
  <style>
    .main { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); }
    .lv { border-top: 5px solid var(--c); }
    .lv-head { display: flex; align-items: center; gap: 10px; }
    .lv-head b { font-size: 27px; letter-spacing: -0.03em; }
    .lv-head small { display: block; color: var(--muted); font-size: 17px; margin-top: 2px; }
    .sub { font-size: 17px; font-weight: 800; color: var(--muted); margin-top: 4px; }
    .cond { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); font-size: 18px; font-weight: 600; }
    .cond .x { margin-left: auto; color: var(--muted); cursor: pointer; }
    .act { display: flex; align-items: center; justify-content: space-between; font-size: 18px; font-weight: 700; padding: 6px 2px; }
    .conds { display: grid; gap: 8px; }
    .cond.off { opacity: 0.55; }
    .cond .moves { margin-left: auto; display: flex; gap: 4px; }
    .mv { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: #121820; color: var(--muted); font: inherit; font-size: 16px; cursor: pointer; }
    .mv:hover, .mv:focus-visible { color: var(--ink); border-color: rgba(255, 154, 31, 0.7); outline: none; }
    /* 좁은 화면: 세 칸을 나란히 두면 칸이 가늘어지므로 높음 · 중간 · 낮음을 폭 가득한 가로 띠로 위에서부터 */
    @media (max-width: 900px) {
      .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-auto-rows: auto; }
      .lv { border-top: 0; border-left: 5px solid var(--c); }
      .lv-head b { font-size: 23px; }
    }
  </style>
</head>
<body>
  <div class="page full">
    <header class="cell head"></header>

    <main class="main">
      <section class="cell lv" style="--c:var(--red)"><div class="pad">
        <div class="lv-head"><span class="status stop" style="font-size:18px; padding:4px 12px">높음</span><div><b>즉시 조치</b><small>사람이 다칠 수 있는 상황</small></div></div>
        <div class="sub">이 감지 유형은 기본으로 높음</div>
        <div class="conds" data-lv="HIGH"></div>
        <select class="input" data-need="ADMIN" data-add="HIGH" aria-label="높음으로 옮길 감지 유형"></select>
      </div></section>

      <section class="cell lv" style="--c:var(--amber)"><div class="pad">
        <div class="lv-head"><span class="status warn" style="font-size:18px; padding:4px 12px">중간</span><div><b>현장 점검</b><small>위험해질 수 있는 상황</small></div></div>
        <div class="sub">이 감지 유형은 기본으로 중간</div>
        <div class="conds" data-lv="MEDIUM"></div>
        <select class="input" data-need="ADMIN" data-add="MEDIUM" aria-label="중간으로 옮길 감지 유형"></select>
      </div></section>

      <section class="cell lv" style="--c:var(--green)"><div class="pad">
        <div class="lv-head"><span class="status ok" style="font-size:18px; padding:4px 12px">낮음</span><div><b>기록</b><small>지켜볼 상황</small></div></div>
        <div class="sub">이 감지 유형은 기본으로 낮음</div>
        <div class="conds" data-lv="LOW"></div>
        <select class="input" data-need="ADMIN" data-add="LOW" aria-label="낮음으로 옮길 감지 유형"></select>
        <div class="hint">여기서 정한 것은 <b>기본값</b>입니다. 바꾸면 바로 저장되고, 이미 생긴 이벤트의 심각도는 그대로입니다.</div>
      </div></section>
    </main>
  </div>
  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    requireLogin();
    const ORDER = ["HIGH", "MEDIUM", "LOW"];
    let types = [];

    function render() {
      ORDER.forEach((lv) => {
        const mine = types.filter((t) => t.default_severity === lv);
        document.querySelector(`[data-lv="${lv}"]`).innerHTML = mine.length ? mine.map((t) => {
          const i = ORDER.indexOf(lv);
          return `<div class="cond${t.is_active ? "" : " off"}" data-id="${t.id}">${esc(t.label)} <span class="muted" style="font-size:16px">${esc(t.code)}${t.is_active ? "" : " · 사용 안 함"}</span>
            <span class="moves" data-need="ADMIN">${i > 0 ? `<button class="mv" data-to="${ORDER[i - 1]}" title="${labelOf("severity", ORDER[i - 1])}으로 올리기">▲</button>` : ""}${i < 2 ? `<button class="mv" data-to="${ORDER[i + 1]}" title="${labelOf("severity", ORDER[i + 1])}으로 내리기">▼</button>` : ""}</span></div>`;
        }).join("") : '<div class="muted" style="padding:6px 2px">없음</div>';
        const others = types.filter((t) => t.default_severity !== lv);
        document.querySelector(`[data-add="${lv}"]`).innerHTML = `<option value="">＋ 다른 감지 유형을 ${labelOf("severity", lv)}으로 옮기기</option>`
          + others.map((t) => `<option value="${t.id}">${esc(t.label)} (지금 ${labelOf("severity", t.default_severity)})</option>`).join("");
      });
    }

    async function move(id, to) {
      const t = types.find((x) => x.id === Number(id));
      try {
        const saved = await api(`/api/detection-types/${t.id}/rule`, { method: "PATCH", body: { default_severity: to } });
        types = types.map((x) => (x.id === saved.id ? saved : x));
        render();
        toast(`${saved.label}: 기본 심각도를 ${labelOf("severity", to)}으로 바꿨습니다.`);
      } catch (err) { toast(err.message); }
    }

    document.querySelector("main").addEventListener("click", (e) => {
      const b = e.target.closest(".mv");
      if (b) move(b.closest(".cond").dataset.id, b.dataset.to);
    });
    document.querySelector("main").addEventListener("change", (e) => {
      const sel = e.target.closest("[data-add]");
      if (sel && sel.value) move(sel.value, sel.dataset.add);
    });

    api("/api/detection-types").then((list) => { types = list; render(); }).catch((err) => toast(err.message));
  </script>
</body>
</html>
