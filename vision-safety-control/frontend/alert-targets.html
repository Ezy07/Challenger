<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0c1016" />
  <title>알림 대상 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>
  try { if (localStorage.getItem("safety.mode") === "light") document.documentElement.dataset.mode = "light"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="mode_change.css" />
  <style>
    .main { grid-template-rows: minmax(0, 1fr); }
    .page.rail-over > .right > .pad:first-child { flex: none; }
    .tbl td, .tbl th { text-align: center; vertical-align: middle; }
    .tbl td:first-child, .tbl th:first-child { text-align: left; }
    .tbl .switch { display: inline-block; }
    .who b { display: block; }
    .who small { color: var(--muted); font-size: 17px; }
  </style>
</head>
<body>
  <div class="page no-left rail-hidden rail-over">
    <button type="button" class="rail-toggle rail-right" data-rail="right" aria-controls="rail" aria-expanded="false" title="오른쪽 패널 열기">◁</button>

    <header class="cell head"></header>

    <main class="main" data-lock="ADMIN">
      <section class="cell">
        <div class="pad">
          <div class="row between">
            <div class="label">누가 · 어떤 심각도를 · 어디로 받을지</div>
            <div class="row">
              <a class="btn" href="users.html" data-need="ADMIN">회원 등록은 회원 목록에서</a>
              <button class="btn primary" data-need="ADMIN" data-toast="알림 대상을 저장했습니다. (예시)">저장</button>
            </div>
          </div>
          <table class="tbl">
            <thead>
              <tr><th>사람</th><th>받을 심각도</th><th>관제 화면</th><th>문자</th><th>메신저</th><th>담당 구역</th></tr>
            </thead>
            <tbody>
              <tr><td class="who"><b>최동현 과장</b><small>안전관리자 · 관리자</small></td><td><span class="status stop">높음</span> <span class="status warn">중간</span> <span class="status ok">낮음</span></td><td><span class="switch on"></span></td><td><span class="switch on"></span></td><td><span class="switch on"></span></td><td>전체</td></tr>
              <tr><td class="who"><b>한지훈 소장</b><small>현장소장 · 관리자</small></td><td><span class="status stop">높음</span></td><td><span class="switch"></span></td><td><span class="switch on"></span></td><td><span class="switch on"></span></td><td>전체</td></tr>
              <tr><td class="who"><b>오세영 주임</b><small>안전관리자 (주간)</small></td><td><span class="status stop">높음</span> <span class="status warn">중간</span> <span class="status ok">낮음</span></td><td><span class="switch on"></span></td><td><span class="switch"></span></td><td><span class="switch"></span></td><td>전체</td></tr>
              <tr><td class="who"><b>윤가람 주임</b><small>안전관리자 (야간)</small></td><td><span class="status stop">높음</span> <span class="status warn">중간</span></td><td><span class="switch on"></span></td><td><span class="switch on"></span></td><td><span class="switch"></span></td><td>전체</td></tr>
              <tr><td class="who"><b>박진우 차장</b><small>양중 담당</small></td><td><span class="status stop">높음</span> <span class="status warn">중간</span></td><td><span class="switch"></span></td><td><span class="switch on"></span></td><td><span class="switch on"></span></td><td>101 · 102동, TC</td></tr>
              <tr><td class="who"><b>정민수 부장</b><small>토공 담당</small></td><td><span class="status stop">높음</span> <span class="status warn">중간</span></td><td><span class="switch"></span></td><td><span class="switch on"></span></td><td><span class="switch on"></span></td><td>Sector A</td></tr>
              <tr><td class="who"><b>김철수 과장</b><small>타설 담당</small></td><td><span class="status stop">높음</span></td><td><span class="switch"></span></td><td><span class="switch on"></span></td><td><span class="switch"></span></td><td>101동</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <aside class="cell right" id="rail">
      <div class="pad">
        <div class="label">테스트 발송</div>
        <label class="field" data-need="ADMIN">받는 사람<select class="input"><option>최동현 과장</option><option>박진우 차장</option><option>전체</option></select></label>
        <label class="field" data-need="ADMIN">수단<select class="input"><option>문자</option><option>메신저</option><option>관제 화면</option></select></label>
        <button class="btn primary block" data-need="ADMIN" data-toast="테스트 알림을 보냈습니다. (예시)">🔔 테스트 알림 보내기</button>
      </div>
      <div class="pad" data-pick>
        <div class="label">받는 사람 묶음</div>
        <button class="tc-card active"><strong>전체 <span class="muted">7명</span></strong></button>
        <button class="tc-card"><strong>관리자 <span class="muted">2명</span></strong><p>안전관리자 · 현장소장</p></button>
        <button class="tc-card"><strong>안전관리자 <span class="muted">2명</span></strong><p>관제실 교대 근무</p></button>
        <button class="tc-card"><strong>조회 전용 <span class="muted">3명</span></strong><p>양중 · 토공 · 타설</p></button>
        <div class="hint">조회 전용은 <b>자기 구역</b>에서 생긴 알림만 받습니다.</div>
      </div>
    </aside>
  </div>
  <script src="common.js"></script>
</body>
</html>
