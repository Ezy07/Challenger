<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0c1016" />
  <title>등록 · 수정 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>
  try { if (localStorage.getItem("safety.mode") === "light") document.documentElement.dataset.mode = "light"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="mode_change.css" />
  <style>
    .main { grid-template-rows: minmax(0, 1fr); }
    .form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form .wide { grid-column: 1 / -1; }
    .loc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
    .help { font-size: 16.5px; color: var(--muted); font-weight: 600; }
    .test { min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); font-size: 18px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="page no-left rail-hidden rail-over">

    <header class="cell head"></header>

    <main class="main">
      <section class="cell">
        <form class="pad" id="form" data-lock="ADMIN">
          <div class="label"><span id="form-title" style="all:unset">새 카메라</span> <span>* 는 꼭 입력</span></div>
          <div class="form">
            <label class="field">카메라 이름 *<input class="input" id="ce-name" placeholder="예: CAM_0005" required /></label>
            <div class="field">설치 위치 <span class="help">구역 · 상세 위치</span>
              <div class="loc">
                <select class="input" id="ce-zone" aria-label="설치 구역"></select>
                <input class="input" id="ce-loc" placeholder="예: 3층 외벽 남측" aria-label="상세 위치" />
              </div>
              <span class="help">구역은 <a href="zones.html" style="color:var(--orange)">전체 구역 표시</a>에서 추가하면 여기에 바로 나옵니다.</span>
            </div>
            <div class="field wide">영상 소스
              <div class="chips" id="ce-src" data-single><span class="chip on" data-v="rtsp">카메라 (RTSP)</span><span class="chip" data-v="file">영상 파일</span></div>
            </div>
            <label class="field wide" id="src-rtsp">영상 주소 (RTSP)
              <input class="input" id="ce-url" placeholder="rtsp://아이디:비밀번호@192.168.0.32:554/stream1" />
              <span class="help">카메라 제조사 설명서에 있는 주소. 보통 rtsp://아이피:554/... 모양입니다.</span>
            </label>
            <label class="field wide" id="src-file" hidden>영상 파일 <small class="muted">(storage/videos 폴더)</small>
              <select class="input" id="ce-video"></select>
              <span class="help" id="video-help">실제 카메라 대신 폴더에 넣은 영상을 반복 재생합니다. 파일을 새로 넣었으면 이 화면을 새로고침하세요.</span>
            </label>
            <label class="field">카메라 종류
              <select class="input" id="ce-type"><option value="FIXED">현장 CAM (고정)</option><option value="TC">TC CAM (크레인 부착)</option></select>
            </label>
            <label class="field">연결 장비 (TC CAM만)<select class="input" id="ce-eq" disabled></select></label>
            <label class="field">관제화면 페이지
              <select class="input" id="ce-page"><option value="1">1페이지 (현장)</option><option value="2">2페이지 (TC 관제)</option></select>
            </label>
            <label class="field">페이지 안 칸 번호
              <select class="input" id="ce-slot"><option value="">표시 안 함</option><option value="1">1 (왼쪽 위)</option><option value="2">2 (오른쪽 위)</option><option value="3">3 (왼쪽 아래)</option><option value="4">4 (오른쪽 아래)</option></select>
              <span class="help" id="slot-help">같은 페이지의 같은 칸에는 카메라 1대만 둘 수 있습니다.</span>
            </label>
          </div>
          <div class="row between" data-lacks="ADMIN"><span class="hint">카메라 등록 · 수정은 관리자만 할 수 있습니다. 여기서는 설정을 보기만 합니다.</span><a class="btn" href="cameras.html">← 카메라 목록</a></div>
          <div class="row between" data-need="ADMIN">
            <button class="btn" type="button" id="del" style="color:var(--red)">카메라 삭제</button>
            <div class="row">
              <a class="btn" href="cameras.html">← 카메라 목록</a>
              <button class="btn primary">저장</button>
            </div>
          </div>
        </form>
      </section>
    </main>

    <button type="button" class="rail-toggle rail-right" data-rail="right" aria-controls="rail" aria-expanded="false" title="오른쪽 패널 열기">◁</button>
    <aside class="cell right" id="rail">
      <div class="pad">
        <div class="label">미리보기</div>
        <div class="cell cam" style="height:180px; box-shadow:none">
          <div class="scene" id="pv-scene"><div class="ground-line"></div><div class="bld" style="left:10%; width:22%; height:52%;"></div></div>
          <video class="cam-video" id="pv-video" muted loop playsinline autoplay hidden></video>
          <div class="cam-tag" id="pv-name">새 카메라</div><div class="cam-time js-cam-time"></div>
        </div>
        <div class="check" data-lock="ADMIN"><div><b>사용</b><small>끄면 탐지를 멈춤 (관제화면에서도 빠짐)</small></div><span class="switch on" id="ce-active"></span></div>
        <a class="btn block" id="roi-link" href="roi-draw.html" data-need="ADMIN">이 카메라에 ROI 그리기</a>
        <a class="btn block" href="camera-map.html" data-need="ADMIN">배치도에서 위치 정하기</a>
      </div>
    </aside>
  </div>
  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    requireLogin();
    const $ = (id) => document.getElementById(id);
    let cams = [], cam = null, videos = [];

    async function load(id) {
      const [list, zones, eq, vids] = await Promise.all([api("/api/cameras"), api("/api/work-zones"), api("/api/equipment"), api("/api/videos")]);
      cams = list;
      videos = vids;
      $("ce-zone").innerHTML = '<option value="">구역 고르기 (없음)</option>' + zones.map((z) => `<option value="${z.id}">${esc(z.name)}</option>`).join("");
      $("ce-eq").innerHTML = '<option value="">없음</option>' + eq.filter((e) => e.equip_type === "TC")
        .map((e) => `<option value="${e.id}">${esc(e.name)}</option>`).join("");
      // 새로 등록은 관리자만. 아니면 번호가 없을 때 첫 카메라를 보여 준다
      show(cams.find((c) => c.id === id) || (can("ADMIN") ? null : cams[0] || null));
    }

    function show(c) {
      cam = c;
      history.replaceState(null, "", c ? "?id=" + c.id : location.pathname);
      $("form-title").textContent = c ? c.name + " 정보" : "새 카메라";
      $("ce-name").value = c ? c.name : "";
      $("ce-loc").value = c ? c.location_desc || "" : "";
      const isFile = Boolean(c && videoSrc(c.stream_url));
      setSource(isFile ? "file" : "rtsp");
      $("ce-url").value = c && !isFile ? c.stream_url || "" : "";
      fillVideos(isFile ? c.stream_url : null);
      $("ce-zone").value = c ? c.work_zone_id || "" : "";
      $("ce-type").value = c ? c.camera_type : "FIXED";
      $("ce-eq").value = c ? c.equipment_id || "" : "";
      $("ce-page").value = c ? c.view_page : "1";
      $("ce-slot").value = c ? c.view_slot || "" : "";
      $("ce-active").classList.toggle("on", c ? c.is_active : true);
      $("ce-eq").disabled = $("ce-type").value !== "TC";
      applyRoleLocks(); // 관리자가 아니면 다시 잠금
      $("del").hidden = !c;
      $("pv-name").textContent = c ? c.name : "새 카메라";
      $("roi-link").hidden = !c;
      $("roi-link").href = c ? "roi-draw.html?camera=" + c.id : "roi-draw.html";
      showSlotOwner();
    }

    // 고른 칸에 이미 다른 카메라가 있으면 미리 알려 준다 (저장하면 서버도 막음)
    function showSlotOwner() {
      const page = Number($("ce-page").value), slot = Number($("ce-slot").value);
      const owner = slot && cams.find((x) => x.view_page === page && x.view_slot === slot && (!cam || x.id !== cam.id));
      $("slot-help").innerHTML = owner
        ? `<span style="color:var(--red)">이 칸에는 이미 <b>${esc(owner.name)}</b> 가 있습니다.</span>`
        : "같은 페이지의 같은 칸에는 카메라 1대만 둘 수 있습니다.";
    }
    // 영상 소스: 카메라(RTSP) 주소 또는 storage/videos 폴더의 영상 파일
    const source = () => document.querySelector("#ce-src .chip.on").dataset.v;
    function setSource(v) {
      document.querySelectorAll("#ce-src .chip").forEach((c) => c.classList.toggle("on", c.dataset.v === v));
      $("src-rtsp").hidden = v !== "rtsp";
      $("src-file").hidden = v !== "file";
      preview();
    }
    function fillVideos(selected) {
      const listed = videos.some((v) => v.stream_url === selected);
      $("ce-video").innerHTML = (videos.length ? "" : '<option value="">폴더에 영상이 없습니다</option>')
        + (selected && !listed ? `<option value="${esc(selected)}">${esc(selected.slice(7))} (폴더에 없음)</option>` : "")
        + videos.map((v) => `<option value="${esc(v.stream_url)}">${esc(v.name)} · ${v.size_mb}MB · ${esc(v.codec || "형식 모름")}${v.browser_ok ? "" : " ⚠"}</option>`).join("");
      if (selected) $("ce-video").value = selected;
      preview();
    }
    // 오른쪽 미리보기: 영상 파일이면 실제 영상, 아니면 예시 그림
    function preview() {
      const v = videos.find((x) => x.stream_url === $("ce-video").value);
      const src = source() === "file" && v ? v.url : null;
      $("video-help").innerHTML = v && !v.browser_ok
        ? `<span style="color:var(--amber)">⚠ ${esc(v.codec || "알 수 없는")} 형식이라 이 PC 브라우저에서는 안 보일 수 있습니다. H.264 로 바꿔 넣으세요 (storage/videos/README.md).</span>`
        : "실제 카메라 대신 폴더에 넣은 영상을 반복 재생합니다. 파일을 새로 넣었으면 이 화면을 새로고침하세요.";
      // 영상은 바로 보이게 둔다 (숨긴 영상은 브라우저가 자동재생을 안 함). 첫 화면 전에는 투명해서 예시 그림이 비친다
      const video = $("pv-video");
      if (!src) { video.pause(); video.removeAttribute("src"); video.hidden = true; $("pv-scene").hidden = false; return; }
      video.hidden = false;
      if (video.getAttribute("src") !== src) { $("pv-scene").hidden = false; video.src = src; }
      video.onplaying = () => { $("pv-scene").hidden = true; };
      video.onerror = () => { video.hidden = true; $("pv-scene").hidden = false; };
      video.play().catch(() => {});
    }
    $("ce-src").addEventListener("click", (e) => { const c = e.target.closest(".chip"); if (c) setSource(c.dataset.v); });
    $("ce-video").addEventListener("change", preview);

    $("ce-page").addEventListener("change", showSlotOwner);
    $("ce-slot").addEventListener("change", showSlotOwner);
    $("ce-name").addEventListener("input", () => { $("pv-name").textContent = $("ce-name").value || "새 카메라"; });

    // TC CAM 을 고르면 연결 장비를 고를 수 있고, 기본 페이지가 2페이지로 바뀐다
    $("ce-type").addEventListener("change", (e) => {
      const tc = e.target.value === "TC";
      $("ce-eq").disabled = !tc;
      if (!tc) $("ce-eq").value = "";
      $("ce-page").value = tc ? "2" : "1";
      showSlotOwner();
    });

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = {
        name: $("ce-name").value.trim(),
        location_desc: $("ce-loc").value.trim() || null,
        stream_url: source() === "file" ? $("ce-video").value || null : $("ce-url").value.trim() || null,
        work_zone_id: Number($("ce-zone").value) || null,
        camera_type: $("ce-type").value,
        equipment_id: Number($("ce-eq").value) || null,
        view_page: Number($("ce-page").value),
        view_slot: Number($("ce-slot").value) || null,
        is_active: $("ce-active").classList.contains("on"),
      };
      try {
        const saved = cam
          ? await api(`/api/cameras/${cam.id}`, { method: "PATCH", body })
          : await api("/api/cameras", { method: "POST", body });
        toast(cam ? "카메라 정보를 저장했습니다." : "카메라를 등록했습니다.");
        await load(saved.id);
      } catch (err) { toast(err.message); }
    });

    $("del").addEventListener("click", async () => {
      if (!confirm(`${cam.name} 을(를) 삭제할까요?`)) return;
      try {
        await api(`/api/cameras/${cam.id}`, { method: "DELETE" });
        location.href = "cameras.html"; // 목록이 이 화면에서 빠져서 카메라 목록으로 돌아간다
      } catch (err) { toast(err.message); }
    });

    load(Number(new URLSearchParams(location.search).get("id"))).catch((err) => toast(err.message));
  </script>
</body>
</html>
