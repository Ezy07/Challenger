<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>배치도 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    .main { grid-template-rows: auto minmax(0, 1fr); }
    .cam-list { padding: 12px 14px; display: grid; gap: 10px; }
    .cam-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; max-height: 150px; overflow: auto; }
    .cam-items .item { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
    .cam-items .item.on { border-color: var(--orange); background: rgba(255, 154, 31, 0.08); }
    .map-cell { display: flex; flex-direction: column; }
    .map-cell .pad { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
    .edit-bar { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px; border: 1px dashed rgba(255, 154, 31, 0.6); background: rgba(255, 154, 31, 0.06); font-size: 13px; }
    #edit-cam { width: 220px; }
    .sliders { display: grid; gap: 4px; }
    .sliders label { display: grid; grid-template-columns: 30px 150px 60px; align-items: center; gap: 8px; }
    .swatches { display: flex; align-items: center; gap: 5px; }
    .swatches button { width: 22px; height: 22px; border-radius: 6px; border: 2px solid transparent; background: var(--c); cursor: pointer; padding: 0; }
    .swatches button.on { border-color: #fff; box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.5); }
    .swatches input[type=color] { width: 26px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
    .swatches button:disabled, .swatches input:disabled { opacity: 0.35; cursor: default; }
    .item .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    #marks { position: absolute; inset: 0; width: 100%; height: 100%; }
    #marks .cam { cursor: pointer; }
    #marks .cam:hover circle, #marks .cam.on circle { stroke: #fff; stroke-width: 3; }
    .editing #marks { cursor: crosshair; }
    .editing #marks .cam { cursor: grab; }
    .plan-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 14px; font-weight: 700; pointer-events: none; }
    .plan-info { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
    .plan-info span { color: var(--muted); font-weight: 700; }
  </style>
</head>
<body>
  <div class="page full">
    <header class="cell head"></header>

    <main class="main">
      <section class="cell cam-list">
        <div class="row between"><div class="label">카메라 위치 <span id="n-cams">0대</span></div>
          <div class="row"><span class="muted"><b style="color:var(--ink)">부채꼴</b>은 카메라의 시야, <b style="color:var(--ink)">원</b>은 돌면서 전체를 보는 카메라입니다. 도면에서 비어 있는 곳은 카메라를 더 달아야 할 곳입니다.</span>
          <a class="btn sm primary" href="camera-edit.html" data-need="ADMIN">＋ 카메라 추가</a></div></div>
        <div class="cam-items" id="cams"></div>
      </section>

      <section class="cell map-cell">
        <div class="pad" id="map-box">
          <div class="row between">
            <div class="label"><span id="plan-title" style="all:unset">현장 배치도</span> <span id="plan-sub">카메라를 누르면 그 카메라 정보로 이동</span></div>
            <div class="row" data-need="ADMIN">
              <button class="btn sm" type="button" data-open="plan-pop">🖼 도면 관리</button>
              <button class="btn sm" type="button" id="edit-toggle">✥ 카메라 배치 수정</button>
            </div>
          </div>
          <div class="edit-bar" id="edit-bar" hidden>
            <select class="input" id="edit-cam" aria-label="배치할 카메라"></select>
            <span class="muted" id="edit-help"></span>
            <span class="grow"></span>
            <div class="sliders">
              <label title="카메라가 보는 방향">시야 <input type="range" id="dir" min="0" max="355" step="5" value="0" disabled /> <b id="dir-out">0°</b></label>
              <label title="끝까지 넓히면 360° 원 (회전 카메라)">화각 <input type="range" id="fov" min="10" max="360" step="5" value="60" disabled /> <b id="fov-out">60°</b></label>
              <label title="부채꼴 · 원의 크기">크기 <input type="range" id="range" min="30" max="500" step="10" value="110" disabled /> <b id="range-out">110</b></label>
            </div>
            <span class="swatches" id="swatches" aria-label="화각 색">색
              <button type="button" data-color="" title="기본색 (현장 주황 · TC 파랑)" style="--c:conic-gradient(#ff9a1f 0 50%, #6cb6ff 0)"></button>
              <button type="button" data-color="#ff5d5d" title="빨강" style="--c:#ff5d5d"></button>
              <button type="button" data-color="#ff9a1f" title="주황" style="--c:#ff9a1f"></button>
              <button type="button" data-color="#f5c400" title="노랑" style="--c:#f5c400"></button>
              <button type="button" data-color="#3ddc84" title="초록" style="--c:#3ddc84"></button>
              <button type="button" data-color="#6cb6ff" title="파랑" style="--c:#6cb6ff"></button>
              <button type="button" data-color="#b07cff" title="보라" style="--c:#b07cff"></button>
              <input type="color" id="color-pick" title="다른 색 고르기" value="#ff9a1f" />
            </span>
            <button class="btn sm" type="button" id="unplace" disabled>배치도에서 빼기</button>
            <button class="btn sm primary" type="button" id="edit-done">저장</button>
          </div>
          <div class="plan-area">
            <div class="plan" id="plan">
              <svg id="marks" preserveAspectRatio="none" aria-label="카메라 위치"></svg>
              <div class="plan-empty" id="plan-empty" hidden></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="pop" id="plan-pop" hidden>
    <div class="pop-card" style="width:min(540px, 100%)">
      <div class="pop-head">
        <div><span class="role">전체 구역 표시와 함께 씀</span><h2>도면 관리</h2><p>PNG · JPG · WebP, 15MB 까지. PDF · CAD 도면은 그림으로 저장해서 올려 주세요.</p></div>
        <button class="btn sm" data-close>닫기</button>
      </div>
      <div class="pop-body">
        <div class="plan-info" id="plan-info"></div>
        <label class="field">도면 이름<input class="input" id="p-title" maxlength="100" placeholder="예: OO단지 현장 배치도" /></label>
        <label class="field">그림 파일<input class="input" type="file" id="p-file" accept="image/png,image/jpeg,image/webp" /></label>
        <div class="hint">구역 · 카메라 위치는 도면 크기에 대한 <b>비율</b>로 저장됩니다. 같은 도면을 고쳐 올리면 그대로 맞고, 전혀 다른 도면으로 바꾸면 위치를 다시 옮겨야 합니다.</div>
        <div class="row between">
          <button class="btn" type="button" id="p-delete" style="color:var(--red)">도면 지우기</button>
          <div class="row">
            <button class="btn" type="button" id="p-rename">이름만 저장</button>
            <button class="btn primary" type="button" id="p-upload">올리기</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    requireLogin();
    const $ = (id) => document.getElementById(id);
    const W = 1000; // 표시 좌표계 너비. 높이는 도면 비율에 맞춘다
    const FOV = 60, RANGE = 110; // 화각 폭 · 길이 기본값 (plan_fov · plan_range 가 null 일 때)
    let plan = null, cams = [], H = W / PLAN_RATIO, editing = false, picked = null, drag = null;

    const placed = (c) => c.plan_x != null && c.plan_y != null;
    // 화각 색: 카메라마다 고른 색(plan_color) → 없으면 현장 주황 · TC 파랑. 사용 안 함은 회색
    const baseColor = (c) => c.plan_color || (c.camera_type === "TC" ? "#6cb6ff" : "#ff9a1f");
    const color = (c) => (!c.is_active ? "#8e9aab" : baseColor(c));
    const fovOf = (c) => c.plan_fov ?? FOV, rangeOf = (c) => c.plan_range ?? RANGE;

    // 화각 모양: 360° 면 원(돌면서 전체를 보는 카메라), 아니면 부채꼴
    function cone(x, y, dir, fov, r) {
      if (fov >= 360) return `M${x - r},${y} a${r},${r} 0 1 0 ${2 * r},0 a${r},${r} 0 1 0 ${-2 * r},0 Z`;
      const pt = (deg) => [x + r * Math.sin(deg * Math.PI / 180), y - r * Math.cos(deg * Math.PI / 180)];
      const [x1, y1] = pt(dir - fov / 2), [x2, y2] = pt(dir + fov / 2);
      return `M${x},${y} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${fov > 180 ? 1 : 0} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
    }

    function drawMarks() {
      $("marks").setAttribute("viewBox", `0 0 ${W} ${H.toFixed(1)}`);
      $("marks").innerHTML = cams.filter(placed).map((c) => {
        const x = c.plan_x * W, y = c.plan_y * H, col = color(c);
        const ty = y + 34 > H ? y - 18 : y + 30; // 도면 아래 끝이면 이름을 점 위에
        const label = c.name + (c.is_active ? "" : " (사용 안 함)");
        return `<g class="cam${picked === c.id ? " on" : ""}" data-id="${c.id}">
          ${c.plan_dir == null ? "" : `<path d="${cone(x, y, c.plan_dir, fovOf(c), rangeOf(c))}" fill="${col}" fill-opacity="${fovOf(c) >= 360 ? 0.22 : 0.42}" stroke="${col}" stroke-opacity="0.95" stroke-width="2.5" stroke-linejoin="round" />`}
          <circle cx="${x}" cy="${y}" r="10" fill="${col}" stroke="#0c1016" stroke-width="3" />
          <text x="${x}" y="${ty}" fill="#fff" font-size="18" font-weight="800" text-anchor="middle" paint-order="stroke" stroke="#0c1016" stroke-width="4">${esc(label)}</text></g>`;
      }).join("");
    }

    function drawList() {
      $("n-cams").textContent = `${cams.length}대 · 배치 ${cams.filter(placed).length}대`;
      $("cams").innerHTML = cams.map((c) => {
        const where = !placed(c) ? "배치도에 없음" : c.plan_dir == null ? "방향 없음" : fovOf(c) >= 360 ? "360° 회전" : `${c.plan_dir}° 방향 · 화각 ${fovOf(c)}°`;
        return `<button class="item ${c.is_active ? "ok" : ""}${picked === c.id ? " on" : ""}" type="button" data-id="${c.id}">
          <div class="item-top"><b><i class="dot" style="background:${color(c)}"></i>${esc(c.name)}</b><span class="status ${c.is_active ? (placed(c) ? "ok" : "warn") : "mute"}">${c.is_active ? (placed(c) ? "배치됨" : "위치 없음") : "사용 안 함"}</span></div>
          <div class="desc">${esc([c.work_zone_name, c.location_desc].filter(Boolean).join(" · ") || "설치 위치 없음")} · ${where}</div></button>`;
      }).join("") || '<p class="muted">등록된 카메라가 없습니다</p>';
    }

    function drawPlan() {
      paintPlan($("plan"), plan);
      H = W / (plan ? plan.width / plan.height : PLAN_RATIO);
      $("plan-title").textContent = plan ? plan.title : "현장 배치도";
      $("plan-empty").hidden = Boolean(plan);
      $("plan-empty").textContent = can("ADMIN") ? "아직 도면이 없습니다. [🖼 도면 관리]에서 현장 도면을 올려 주세요." : "아직 도면이 없습니다. 관리자가 올리면 보입니다.";
      const info = plan ? [["이름", plan.title], ["파일", plan.original_name || "-"], ["크기", `${plan.width} × ${plan.height}px · ${plan.size_bytes < 1048576 ? Math.ceil(plan.size_bytes / 1024) + "KB" : (plan.size_bytes / 1048576).toFixed(1) + "MB"}`],
        ["올린 사람", `${plan.uploaded_by_name || "-"} · ${fmtTime(plan.uploaded_at).slice(0, 16)}`]] : [["지금", "올린 도면이 없습니다 (격자 배경)"]];
      $("plan-info").innerHTML = info.map(([k, v]) => `<span>${k}</span><b>${esc(v)}</b>`).join("");
      $("p-title").value = plan ? plan.title : "";
      $("p-delete").hidden = $("p-rename").hidden = !plan;
      $("p-upload").textContent = plan ? "새 그림으로 바꾸기" : "올리기";
      drawMarks();
    }

    function drawEdit() {
      $("map-box").classList.toggle("editing", editing);
      $("edit-bar").hidden = !editing;
      $("edit-toggle").classList.toggle("primary", editing);
      $("plan-sub").textContent = editing ? "카메라 배치 수정 중" : "카메라를 누르면 그 카메라 정보로 이동";
      const c = cams.find((x) => x.id === picked);
      $("edit-cam").innerHTML = '<option value="">카메라 선택</option>'
        + cams.map((x) => `<option value="${x.id}">${esc(x.name)}${placed(x) ? "" : " · 위치 없음"}</option>`).join("");
      $("edit-cam").value = c ? c.id : "";
      $("edit-help").textContent = !c ? "카메라를 고른 뒤 도면을 누르면 그 자리에 놓입니다."
        : placed(c) ? "아이콘을 끌어서 옮길 수 있습니다. 바꾸면 바로 저장됩니다." : "도면을 눌러 놓으세요.";
      const on = Boolean(c && placed(c));
      $("unplace").disabled = $("fov").disabled = $("range").disabled = !on;
      $("dir").disabled = !on || fovOf(c) >= 360; // 원이면 방향이 의미 없음
      $("dir").value = c && c.plan_dir != null ? c.plan_dir : 0;
      $("dir-out").textContent = $("dir").value + "°";
      $("fov").value = c ? fovOf(c) : FOV;
      $("fov-out").textContent = $("fov").value >= 360 ? "360° 원" : $("fov").value + "°";
      $("range").value = c ? rangeOf(c) : RANGE;
      $("range-out").textContent = $("range").value;
      document.querySelectorAll("#swatches button").forEach((b) => {
        b.disabled = !c;
        b.classList.toggle("on", Boolean(c) && b.dataset.color === (c.plan_color || "").toLowerCase());
      });
      $("color-pick").disabled = !c;
      if (c) $("color-pick").value = baseColor(c);
    }

    function redraw() { drawList(); drawMarks(); drawEdit(); }

    async function save(c, body) {
      try {
        Object.assign(c, await api(`/api/cameras/${c.id}`, { method: "PATCH", body }));
      } catch (err) { toast(err.message); }
      redraw();
    }

    // 화면 좌표 → 도면 비율 (0~1)
    function toPlan(ev) {
      const r = $("marks").getBoundingClientRect();
      const clamp = (v) => Math.min(1, Math.max(0, v));
      return [clamp((ev.clientX - r.left) / r.width), clamp((ev.clientY - r.top) / r.height)];
    }
    const round4 = (v) => Math.round(v * 10000) / 10000;

    $("cams").addEventListener("click", (e) => {
      const b = e.target.closest("[data-id]");
      if (!b) return;
      picked = Number(b.dataset.id) === picked && !editing ? null : Number(b.dataset.id);
      redraw();
    });
    $("edit-cam").addEventListener("change", () => {
      picked = Number($("edit-cam").value) || null;
      redraw();
    });
    $("marks").addEventListener("click", (e) => {
      if (editing) return;
      const g = e.target.closest(".cam");
      if (g) location.href = "camera-edit.html?id=" + g.dataset.id;
    });
    $("marks").addEventListener("pointerdown", (e) => {
      if (!editing) return;
      const g = e.target.closest(".cam");
      if (g) {
        picked = Number(g.dataset.id);
        drag = { cam: cams.find((c) => c.id === picked), moved: false };
        $("marks").setPointerCapture(e.pointerId);
        redraw();
        return;
      }
      const c = cams.find((x) => x.id === picked);
      if (!c) return toast("먼저 놓을 카메라를 고르세요.");
      const [x, y] = toPlan(e);
      save(c, { plan_x: round4(x), plan_y: round4(y), plan_dir: c.plan_dir ?? 0 });
    });
    $("marks").addEventListener("pointermove", (e) => {
      if (!drag) return;
      [drag.cam.plan_x, drag.cam.plan_y] = toPlan(e);
      drag.moved = true;
      drawMarks();
    });
    $("marks").addEventListener("pointerup", () => {
      if (!drag) return;
      const { cam, moved } = drag;
      drag = null;
      if (moved) save(cam, { plan_x: round4(cam.plan_x), plan_y: round4(cam.plan_y) });
    });
    $("dir").addEventListener("input", () => {
      const c = cams.find((x) => x.id === picked);
      if (!c) return;
      c.plan_dir = Number($("dir").value);
      $("dir-out").textContent = c.plan_dir + "°";
      drawMarks();
    });
    $("dir").addEventListener("change", () => {
      const c = cams.find((x) => x.id === picked);
      if (c) save(c, { plan_dir: c.plan_dir });
    });
    // 화각 폭 · 크기: 끄는 동안 미리 보고, 손을 떼면 저장
    for (const [id, key] of [["fov", "plan_fov"], ["range", "plan_range"]]) {
      $(id).addEventListener("input", () => {
        const c = cams.find((x) => x.id === picked);
        if (!c) return;
        c[key] = Number($(id).value);
        drawMarks();
        drawEdit();
      });
      $(id).addEventListener("change", () => {
        const c = cams.find((x) => x.id === picked);
        if (c) save(c, { [key]: c[key] });
      });
    }
    $("swatches").addEventListener("click", (e) => {
      const b = e.target.closest("[data-color]"), c = cams.find((x) => x.id === picked);
      if (b && c) save(c, { plan_color: b.dataset.color || null });
    });
    $("color-pick").addEventListener("input", () => { // 고르는 동안 미리 보고, 창을 닫으면 저장
      const c = cams.find((x) => x.id === picked);
      if (c) { c.plan_color = $("color-pick").value; drawMarks(); }
    });
    $("color-pick").addEventListener("change", () => {
      const c = cams.find((x) => x.id === picked);
      if (c) save(c, { plan_color: $("color-pick").value });
    });
    $("unplace").addEventListener("click", () => {
      const c = cams.find((x) => x.id === picked);
      if (c && confirm(`${c.name} 을(를) 배치도에서 뺄까요? (카메라는 그대로 남습니다)`)) save(c, { plan_x: null, plan_y: null, plan_dir: null });
    });
    $("edit-toggle").addEventListener("click", () => { editing = !editing; redraw(); });
    $("edit-done").addEventListener("click", () => { editing = false; redraw(); });

    // ---------------- 도면 관리 (올리기 · 바꾸기 · 이름 · 지우기)
    $("p-upload").addEventListener("click", async () => {
      const file = $("p-file").files[0];
      if (!file) return toast("올릴 그림 파일을 고르세요.");
      if (plan && !confirm("지금 도면을 새 그림으로 바꿀까요? 전체 구역 표시 화면의 도면도 함께 바뀝니다.")) return;
      $("p-upload").disabled = true;
      try {
        plan = await api("/api/site-plan", { method: "PUT", body: file, query: { filename: file.name, title: $("p-title").value.trim() } });
        $("p-file").value = "";
        drawPlan();
        toast("도면을 올렸습니다.");
      } catch (err) { toast(err.message); }
      $("p-upload").disabled = false;
    });
    $("p-rename").addEventListener("click", async () => {
      const title = $("p-title").value.trim();
      if (!title) return toast("도면 이름을 적으세요.");
      try {
        plan = await api("/api/site-plan", { method: "PATCH", body: { title } });
        drawPlan();
        toast("도면 이름을 바꿨습니다.");
      } catch (err) { toast(err.message); }
    });
    $("p-delete").addEventListener("click", async () => {
      if (!confirm("도면을 지울까요? 전체 구역 표시 화면에서도 사라지고 격자 배경으로 돌아갑니다. (구역 · 카메라 위치는 남습니다)")) return;
      try {
        await api("/api/site-plan", { method: "DELETE" });
        plan = null;
        drawPlan();
        toast("도면을 지웠습니다.");
      } catch (err) { toast(err.message); }
    });

    (async () => {
      [plan, cams] = await Promise.all([loadSitePlan(), api("/api/cameras")]);
      drawPlan();
      redraw();
    })().catch((err) => toast(err.message));
  </script>
</body>
