<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0c1016" />
  <title>장비 등록 및 배정 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>
  try { if (localStorage.getItem("safety.mode") === "light") document.documentElement.dataset.mode = "light"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="mode_change.css" />
  <style>
    .main { grid-template-rows: auto minmax(0, 1fr); }
    .tbl td { vertical-align: middle; }
    .tbl select.input { padding: 5px 8px; font-size: 17.5px; min-width: 150px; }
    .tbl tr.changed td { background: rgba(255, 154, 31, 0.07); }
  </style>
</head>
<body>
  <div class="page no-left rail-hidden rail-over">

    <header class="cell head"></header>

    <main class="main">
      <section class="cell searchbar">
        <div class="searchbar-row">
          <input class="input" id="q" style="width:220px" placeholder="장비명 · 등록번호로 찾기" />
          <button type="button" class="btn search-toggle" data-search-toggle aria-expanded="false" aria-controls="filter">검색 조건 <em class="search-sum" hidden></em><i class="chev">▾</i></button>
          <span class="muted" id="changed" data-need="MANAGER">바뀐 항목 없음</span><span class="muted" data-lacks="MANAGER">조회 전용 · 바꿀 수 없음</span>
          <span class="grow"></span>
          <button class="btn" id="add" data-need="MANAGER">＋ 장비 등록</button>
          <button class="btn primary" id="save" data-need="MANAGER">오늘 기록 저장</button>
        </div>
        <div class="search-panel" id="filter" hidden>
          <div class="search-fields">
            <div class="field wide">장비 종류<div class="chips" id="f-type" data-single></div></div>
            <div class="hint">하루 한 번 아침 조회 때 <b>투입 구역 · 운전원 · 상태</b>를 바꾸고 [오늘 기록 저장]을 누르면 장비 상세의 일일 기록에 남습니다. 바꾸지 않은 장비도 오늘 상태가 기록됩니다.</div>
          </div>
          <div class="row end"><button class="btn primary" type="button" data-search-close>닫기</button></div>
        </div>
      </section>
      <section class="cell" style="padding:0 6px 6px; overflow:auto">
        <table class="tbl" data-lock="MANAGER">
          <thead><tr><th>장비</th><th>종류</th><th>등록번호</th><th>투입 구역</th><th>운전원</th><th>상태</th><th>오늘 기록</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </main>

    <button type="button" class="rail-toggle rail-right" data-rail="right" aria-controls="rail" aria-expanded="false" title="오른쪽 패널 열기">◁</button>
    <aside class="cell right" id="rail">
      <div class="pad">
        <div class="label">구역별 투입 <span>저장 전 값 포함</span></div>
        <div id="by-zone"></div>
        <a class="btn block" href="work-workers.html">작업별 장비 · 작업자 목록 →</a>
      </div>
    </aside>
  </div>

  <div class="pop" id="pop" hidden>
    <div class="pop-card">
      <div class="pop-head">
        <div><span class="role">새 장비</span><h2>장비 등록</h2><p>타워크레인은 카메라 등록에서 TC CAM 과 연결할 수 있습니다</p></div>
        <button class="btn sm" data-close>닫기</button>
      </div>
      <form class="pop-body" id="form">
        <label class="field">장비 이름<input class="input" id="n-name" required maxlength="100" placeholder="예: EXC_02" /></label>
        <div class="two">
          <label class="field">종류<select class="input" id="n-type"></select></label>
          <label class="field">등록번호<input class="input" id="n-reg" maxlength="50" placeholder="차량번호 또는 장비 등록번호" /></label>
        </div>
        <div class="two">
          <label class="field">제원<input class="input" id="n-spec" maxlength="200" placeholder="예: 0.8㎥, 15t" /></label>
          <label class="field">소속 회사<input class="input" id="n-company" maxlength="100" /></label>
        </div>
        <label class="field">투입 구역<select class="input" id="n-zone"></select></label>
        <div class="row end"><button class="btn" type="button" data-close>취소</button><button class="btn primary">등록</button></div>
      </form>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    requireLogin();
    const $ = (id) => document.getElementById(id);
    let items = [], zones = [], workers = [];
    const draft = new Map(); // 장비 번호 → 화면에서 바꾼 값 {work_zone_id, operator_id, status}

    const opts = (list, selected, empty) => (empty ? `<option value="">${empty}</option>` : "")
      + list.map(([v, t]) => `<option value="${v}"${String(v) === String(selected ?? "") ? " selected" : ""}>${esc(t)}</option>`).join("");
    const value = (e) => draft.get(e.id) || { work_zone_id: e.work_zone_id, operator_id: e.operator_id, status: e.status };

    async function load() {
      [items, zones, workers] = await Promise.all([api("/api/equipment"), api("/api/work-zones"), api("/api/workers")]);
      draft.clear();
      const types = [...new Set(items.map((e) => e.equip_type))];
      const keep = (document.querySelector("#f-type .chip.on") || {}).dataset;
      $("f-type").innerHTML = [`<span class="chip" data-v="">전체 <b>${items.length}</b></span>`, ...types.map((t) =>
        `<span class="chip" data-v="${t}">${EQUIP_ICON[t]} ${labelOf("equipType", t)} <b>${items.filter((e) => e.equip_type === t).length}</b></span>`)].join("");
      const on = [...$("f-type").children].find((c) => keep && c.dataset.v === keep.v) || $("f-type").firstElementChild;
      on.classList.add("on");
      render();
    }

    function render() {
      const q = $("q").value.trim().toLowerCase(), type = document.querySelector("#f-type .chip.on").dataset.v;
      searchSummary(type ? labelOf("equipType", type) : "");
      const zoneOpts = zones.map((z) => [z.id, z.name]);
      const workerOpts = workers.map((w) => [w.id, `${w.name}${w.company ? ` (${w.company})` : ""}`]);
      const statusOpts = Object.keys(LABEL.equipStatus).map((s) => [s, labelOf("equipStatus", s)]);
      const shown = items.filter((e) => (!type || e.equip_type === type) && (!q || (e.name + " " + (e.reg_no || "")).toLowerCase().includes(q)));
      $("rows").innerHTML = shown.map((e) => {
        const v = value(e);
        return `<tr data-id="${e.id}" class="${draft.has(e.id) ? "changed" : ""}"><td><b>${esc(e.name)}</b></td>
          <td>${esc(labelOf("equipType", e.equip_type))}${e.spec ? `<small class="muted" style="display:block">${esc(e.spec)}</small>` : ""}</td><td class="num">${esc(e.reg_no || "-")}</td>
          <td><select class="input" data-f="work_zone_id">${opts(zoneOpts, v.work_zone_id, "미투입")}</select></td>
          <td><select class="input" data-f="operator_id">${opts(workerOpts, v.operator_id, "없음")}</select></td>
          <td><select class="input" data-f="status">${opts(statusOpts, v.status)}</select></td>
          <td>${e.today_log ? '<span class="status ok">기록됨</span>' : '<span class="status mute">없음</span>'}</td>
          <td><a class="btn sm" href="equipment-detail.html?id=${e.id}">상세</a></td></tr>`;
      }).join("") || '<tr><td colspan="8" class="muted" style="text-align:center; padding:28px">해당하는 장비가 없습니다</td></tr>';
      applyRoleLocks(); // 조회 전용이면 방금 그린 선택 칸도 잠금
      $("changed").textContent = draft.size ? `${draft.size}대 바뀜 · 저장 전` : "바뀐 항목 없음";
      $("changed").style.color = draft.size ? "var(--orange)" : "";

      // 오른쪽: 화면에서 바꾼 값까지 반영한 구역별 투입
      $("by-zone").innerHTML = [...zones.map((z) => [z.id, z.name]), ["", "미투입"]].map(([zid, name]) => {
        const list = items.filter((e) => String(value(e).work_zone_id ?? "") === String(zid));
        if (!list.length) return "";
        const bad = list.filter((e) => value(e).status !== "RUNNING");
        return `<div class="check ${zid === "" ? "info" : bad.length ? "warn" : ""}"><div><b>${esc(name)}</b>
          <small>${list.map((e) => esc(e.name.split(" · ")[0]) + (value(e).status !== "RUNNING" ? ` (${labelOf("equipStatus", value(e).status)})` : "")).join(" · ")}</small></div>
          <span class="status ${zid === "" ? "info" : bad.length ? "warn" : "ok"}">${list.length}대</span></div>`;
      }).join("");
    }

    $("rows").addEventListener("change", (e) => {
      const sel = e.target.closest("select[data-f]");
      if (!sel) return;
      const eq = items.find((x) => x.id === Number(sel.closest("tr").dataset.id));
      const v = { ...value(eq), [sel.dataset.f]: sel.dataset.f === "status" ? sel.value : Number(sel.value) || null };
      const same = v.work_zone_id === eq.work_zone_id && v.operator_id === eq.operator_id && v.status === eq.status;
      if (same) draft.delete(eq.id); else draft.set(eq.id, v);
      render();
    });

    $("save").addEventListener("click", async () => {
      const changedCount = draft.size;
      try {
        await api("/api/equipment/daily", { method: "POST", body: { items: items.map((e) => ({ equipment_id: e.id, ...value(e) })) } });
        toast(changedCount ? `${changedCount}대를 바꾸고 오늘 기록을 저장했습니다.` : "바뀐 항목은 없지만 오늘 기록을 저장했습니다.");
        await load();
      } catch (err) { toast(err.message); }
    });
    window.addEventListener("beforeunload", (e) => { if (draft.size) { e.preventDefault(); e.returnValue = ""; } });

    $("add").addEventListener("click", () => {
      $("form").reset();
      $("n-type").innerHTML = Object.keys(LABEL.equipType).map((t) => `<option value="${t}">${labelOf("equipType", t)}</option>`).join("");
      $("n-zone").innerHTML = opts(zones.map((z) => [z.id, z.name]), "", "미투입");
      $("pop").hidden = false;
      $("n-name").focus();
    });
    $("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      if (draft.size && !confirm("저장하지 않은 변경이 있습니다. 장비를 등록하면 화면을 새로 불러와 변경이 사라집니다. 계속할까요?")) return;
      try {
        const e = await api("/api/equipment", { method: "POST", body: {
          name: $("n-name").value.trim(), equip_type: $("n-type").value, reg_no: $("n-reg").value.trim() || null,
          spec: $("n-spec").value.trim() || null, company: $("n-company").value.trim() || null, work_zone_id: Number($("n-zone").value) || null,
        } });
        $("pop").hidden = true;
        toast(`${e.name} 장비를 등록했습니다.`);
        await load();
      } catch (err) { toast(err.message); }
    });

    $("q").addEventListener("input", render);
    $("f-type").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      $("f-type").querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c === chip));
      render();
    });

    load().catch((err) => toast(err.message));
  </script>
</body>
</html>
