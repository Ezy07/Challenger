<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0c1016" />
  <title>장비 목록 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>
  try { if (localStorage.getItem("safety.mode") === "light") document.documentElement.dataset.mode = "light"; } catch (e) {}
  try { const z = Number(localStorage.getItem("safety.text-zoom")); if (z) document.documentElement.style.setProperty("--text-zoom", z); } catch (e) {}
  </script>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="mode_change.css" />
  <style>
    .main { grid-template-rows: auto auto minmax(0, 1fr); }
    .tbl-wrap { padding: 0 6px 6px; overflow: auto; }
    .tbl td { vertical-align: middle; }
    .tbl tbody tr { cursor: pointer; }
    .eq-name { display: flex; align-items: center; gap: 10px; }
    .eq-ico { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-size: 25px; background: var(--panel-2); flex: none; }
    .eq-name b { display: block; font-size: 18.5px; }
    .eq-name small { display: block; color: var(--muted); font-size: 16.5px; }
  </style>
</head>
<body>
  <div class="page full">
    <header class="cell head">
      <div class="head-acts"><a class="btn primary" href="equipment-assign.html" data-need="MANAGER">＋ 장비 등록 · 배정</a></div>
    </header>

    <main class="main scroll" id="main">
      <section class="cell searchbar">
        <div class="searchbar-row">
          <input class="input" id="q" style="width:220px" placeholder="장비명 · 등록번호로 찾기" />
          <button type="button" class="btn search-toggle" data-search-toggle aria-expanded="false" aria-controls="filter">검색 조건 <em class="search-sum" hidden></em><i class="chev">▾</i></button>
          <b id="n-shown"></b>
          <span class="muted">줄을 누르면 장비 상세로 이동</span>
          <span class="grow"></span>
          <select class="input" id="sort" style="width:150px" aria-label="정렬"><option value="status">상태 (고장 · 점검 먼저)</option><option value="name">이름순</option><option value="type">종류순</option><option value="zone">구역순</option></select>
        </div>
        <div class="search-panel" id="filter" hidden>
          <div class="search-fields">
            <div class="field wide">장비 종류<div class="chips" id="f-type" data-single></div></div>
            <div class="field">상태
              <div class="chips" id="f-status" data-single><span class="chip on" data-v="">전체</span><span class="chip" data-v="RUNNING">가동</span><span class="chip" data-v="IDLE">대기</span><span class="chip" data-v="MAINTENANCE">점검</span><span class="chip" data-v="BROKEN">고장</span></div>
            </div>
          </div>
          <div class="row end"><button class="btn" type="button" id="reset">초기화</button><button class="btn primary" type="button" data-search-close>닫기</button></div>
        </div>
      </section>
      <section class="cell sum-strip" aria-label="오늘 장비 요약">
        <div class="kpi-box"><span>오늘 가동 중</span><strong style="color:var(--green)" id="k-run">0<i>대</i></strong></div>
        <div class="kpi-box"><span>점검 · 고장</span><strong style="color:var(--red)" id="k-bad">0<i>대</i></strong></div>
        <div class="sum-list" id="alerts"></div>
        <div class="sum-acts"><a class="btn" href="monitor.html">실시간 화면에서 보기</a></div>
      </section>
      <section class="cell tbl-wrap">
        <table class="tbl">
          <thead><tr><th>장비</th><th>종류</th><th>등록번호</th><th>위치</th><th>운전원 · 소속</th><th>운전 전 점검</th><th>구역 오늘 이벤트</th><th>상태</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </main>
  </div>
  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    requireLogin();
    const $ = (id) => document.getElementById(id);
    let items = [];

    const ORDER = { BROKEN: 0, MAINTENANCE: 1, IDLE: 2, RUNNING: 3 }; // 손볼 장비가 위로

    function row(e) {
      const who = e.operator_name ? `${e.operator_name}${e.operator_company ? ` (${e.operator_company})` : ""}` : e.company ? `소속 ${e.company}` : "-";
      const ev = e.zone_events_today;
      const check = e.today_log && e.today_log.inspected_at ? `${fmtTime(e.today_log.inspected_at, { date: false }).slice(0, 5)} 완료` : '<span style="color:var(--amber)">기록 없음</span>';
      return `<tr data-href="equipment-detail.html?id=${e.id}">
        <td><div class="eq-name"><span class="eq-ico">${EQUIP_ICON[e.equip_type]}</span><div><b>${esc(e.name)}</b><small>${esc(e.spec || "-")}</small></div></div></td>
        <td>${esc(labelOf("equipType", e.equip_type))}</td><td class="num">${esc(e.reg_no || "-")}</td>
        <td>${esc(e.work_zone_name || "미투입")}</td><td>${esc(who)}</td><td class="num">${check}</td>
        <td class="num"${ev ? ' style="color:var(--red); font-weight:800"' : ""}>${e.work_zone_id ? ev + "건" : "-"}</td>
        <td>${badge("equipStatus", e.status)}</td></tr>`;
    }

    function render() {
      const q = $("q").value.trim().toLowerCase();
      const typeChip = document.querySelector("#f-type .chip.on"), type = typeChip ? typeChip.dataset.v : "";
      const stChip = document.querySelector("#f-status .chip.on"), st = stChip.dataset.v;
      searchSummary([type && labelOf("equipType", type), st && stChip.textContent].filter(Boolean).join(" · "));
      const by = $("sort").value, ko = (a, b) => a.localeCompare(b, "ko");
      const cmp = {
        status: (a, b) => ORDER[a.status] - ORDER[b.status] || ko(a.name, b.name),
        name: (a, b) => ko(a.name, b.name),
        type: (a, b) => ko(labelOf("equipType", a.equip_type), labelOf("equipType", b.equip_type)) || ko(a.name, b.name),
        zone: (a, b) => ko(a.work_zone_name || "힣", b.work_zone_name || "힣") || ko(a.name, b.name), // 미투입은 맨 뒤
      }[by];
      const shown = items.filter((e) => (!type || e.equip_type === type) && (!st || e.status === st)
        && (!q || (e.name + " " + (e.reg_no || "")).toLowerCase().includes(q))).sort(cmp);
      $("n-shown").textContent = shown.length + "대";
      $("rows").innerHTML = shown.length ? shown.map(row).join("")
        : '<tr><td colspan="8" class="muted" style="text-align:center; padding:28px">조건에 맞는 장비가 없습니다</td></tr>';
    }

    $("rows").addEventListener("click", (e) => { const tr = e.target.closest("tr[data-href]"); if (tr) location.href = tr.dataset.href; });
    $("sort").addEventListener("change", render);

    (async () => {
      items = await api("/api/equipment");
      const types = [...new Set(items.map((e) => e.equip_type))];
      $("f-type").innerHTML = [`<span class="chip on" data-v="">전체 <b>${items.length}</b></span>`, ...types.map((t) =>
        `<span class="chip" data-v="${t}">${EQUIP_ICON[t]} ${labelOf("equipType", t)} <b>${items.filter((e) => e.equip_type === t).length}</b></span>`)].join("");
      $("k-run").innerHTML = `${items.filter((e) => e.status === "RUNNING").length}<i>대</i>`;
      const bad = items.filter((e) => e.status === "MAINTENANCE" || e.status === "BROKEN");
      $("k-bad").innerHTML = `${bad.length}<i>대</i>`;
      $("alerts").innerHTML = bad.map((e) => `<div class="check ${e.status === "BROKEN" ? "stop" : "warn"}"><div><b>${esc(e.name)} ${labelOf("equipStatus", e.status)}</b>
        <small>${esc((e.today_log && e.today_log.note) || e.work_zone_name || "미투입")}</small></div><a class="btn sm" href="equipment-detail.html?id=${e.id}">보기</a></div>`).join("");
      render();
    })().catch((err) => toast(err.message));

    $("q").addEventListener("input", render);
    $("f-type").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      $("f-type").querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c === chip));
    });
    $("filter").addEventListener("click", (e) => { if (e.target.closest(".chip")) render(); });
    $("reset").addEventListener("click", () => {
      document.querySelectorAll("#filter .chips").forEach((box) => box.querySelectorAll(".chip").forEach((c, i) => c.classList.toggle("on", i === 0)));
      render();
    });
  </script>
</body>
</html>
