<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>스냅샷 미리보기 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    .main { grid-template-rows: auto minmax(0, 1fr); }
  </style>
</head>
<body>
  <div class="page no-left">
    <header class="cell head"></header>

    <main class="main">
      <section class="cell searchbar">
        <div class="searchbar-row">
          <button type="button" class="btn search-toggle" data-search-toggle aria-expanded="false" aria-controls="pick">이벤트 <em class="search-sum" hidden></em><i class="chev">▾</i></button>
          <span class="muted" id="n-list">눌러서 미리보기</span>
          <span class="grow"></span>
          <a class="btn" href="events.html">← 표로 보기</a>
        </div>
        <div class="search-panel" id="pick" hidden>
          <div class="search-fields"><label class="field">날짜<input class="input" type="date" id="f-date" /></label></div>
          <div class="search-cards" id="list"></div>
        </div>
      </section>
      <section class="cell cam">
        <div class="scene" id="scene">
          <div class="ground-line"></div>
          <div class="bld" style="left:10%; width:22%; height:52%;"></div>
          <div class="mast" style="left:48%; height:64%;"></div>
          <div class="jib" style="left:48%; top:18%; width:34%;"></div>
          <div class="box stop" id="box" style="left:56%; top:34%; width:16%; height:36%;"><em id="box-em"></em></div>
        </div>
        <img id="snap" alt="탐지 순간 스냅샷" hidden style="position:absolute; inset:0; z-index:1; width:100%; height:100%; object-fit:contain; background:#000" />
        <div class="cam-tag" id="tag">-</div>
        <div class="cam-time" id="time">-</div>
        <div class="cam-zone" id="zone">-</div>
      </section>
    </main>

    <aside class="cell right">
      <div class="pad">
        <div class="label">탐지 정보 <span id="ev-no"></span></div>
        <div class="check" id="c-kind"><div><b>종류</b><small id="kind">-</small></div><span class="status" id="sev">-</span></div>
        <div class="check info"><div><b>신뢰도</b><small>모델이 얼마나 확신하는지</small></div><span class="status info" id="conf">-</span></div>
        <div class="check info"><div><b>카메라</b><small id="zone2">-</small></div><span class="status info" id="cam">-</span></div>
        <div class="check info"><div><b>처리 상태</b><small>담당자 확인 여부</small></div><span id="state">-</span></div>
        <a class="btn primary block" id="to-detail" href="event-detail.html">상세 화면으로 (처리 기록 보기)</a>
        <a class="btn block" id="save" href="#" download>이미지 저장</a>
        <div class="hint" id="snap-note" hidden>이 이벤트의 스냅샷 파일을 찾지 못해 예시 그림을 보여 줍니다.</div>
      </div>
    </aside>
  </div>

  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    requireLogin();
    const $ = (id) => document.getElementById(id);
    let events = [], current = null;

    async function load() {
      const day = $("f-date").value;
      const page = await api("/api/events", { query: { date_from: day, date_to: day, size: 100 } });
      events = page.items.filter((e) => e.snapshot);
      $("n-list").textContent = `${events.length}건 · 눌러서 미리보기`;
      $("list").innerHTML = events.length ? events.map((e) => `
        <button class="tc-card" data-id="${e.id}"><div class="code">EV-${e.id} · ${fmtTime(e.detected_at, { date: false })}</div>
          <strong>${esc(e.detection_label)} ${badge("severity", e.severity)}</strong><p>${esc(e.camera_name || "-")} · ${esc(e.work_zone_name || "-")}</p></button>`).join("")
        : '<p class="muted">이 날짜에 스냅샷이 있는 이벤트가 없습니다</p>';
      const want = Number(new URLSearchParams(location.search).get("id"));
      show(events.find((e) => e.id === want) || events[0]);
    }

    function show(e) {
      current = e;
      document.querySelectorAll("#list .tc-card").forEach((c) => c.classList.toggle("active", e && Number(c.dataset.id) === e.id));
      searchSummary(e ? `EV-${e.id} · ${e.detection_label}` : "");
      if (!e) return;
      history.replaceState(null, "", "?id=" + e.id);
      const [cls] = LABEL.severity[e.severity];
      const conf = e.confidence == null ? "-" : Math.round(e.confidence * 100) + "%";
      $("ev-no").textContent = "EV-" + e.id;
      $("tag").textContent = `${e.camera_name || "카메라 없음"} · 탐지 순간`;
      $("time").textContent = fmtTime(e.detected_at);
      $("zone").textContent = $("zone2").textContent = e.work_zone_name || "-";
      $("kind").textContent = e.detection_label;
      $("sev").className = "status " + cls;
      $("sev").textContent = LABEL.severity[e.severity][1];
      $("c-kind").className = "check " + cls;
      $("box").className = "box " + cls;
      $("box-em").textContent = `${e.detection_label} ${conf}`;
      $("conf").textContent = conf;
      $("cam").textContent = e.camera_name || "-";
      $("state").innerHTML = badge("eventStatus", e.status);
      $("to-detail").href = "event-detail.html?id=" + e.id;

      // 실제 스냅샷: 열리면 보여 주고 저장 버튼을 켠다. 못 열면 예시 그림 + 안내
      const src = "/" + encodeURI(e.snapshot);
      const ext = e.snapshot.split(".").pop();
      $("save").href = src;
      $("save").download = `EV-${e.id}_${e.detection_code.toLowerCase()}.${ext}`;
      $("snap").onload = () => { if (current === e) { $("snap").hidden = false; $("snap-note").hidden = true; $("save").classList.remove("disabled"); } };
      $("snap").onerror = () => { if (current === e) { $("snap").hidden = true; $("snap-note").hidden = false; $("save").classList.add("disabled"); } };
      $("snap").hidden = true;
      $("snap").src = src;
    }

    $("list").addEventListener("click", (ev) => {
      const c = ev.target.closest("[data-id]");
      if (c) { show(events.find((e) => e.id === Number(c.dataset.id))); closeSearch(); }
    });
    $("save").addEventListener("click", (ev) => {
      if ($("save").classList.contains("disabled")) { ev.preventDefault(); toast("저장할 스냅샷 파일이 없습니다."); }
    });
    $("f-date").addEventListener("change", () => load().catch((err) => toast(err.message)));

    // ?id= 로 열면 그 이벤트가 난 날짜의 목록을 연다 (지난 날짜 이벤트도 보이게)
    async function start() {
      const want = Number(new URLSearchParams(location.search).get("id"));
      const ev = want ? await api("/api/events/" + want).catch(() => null) : null;
      $("f-date").value = ev ? ev.detected_at.slice(0, 10) : todayStr();
      await load();
    }
    start().catch((err) => toast(err.message));
  </script>
</body>
</html>
