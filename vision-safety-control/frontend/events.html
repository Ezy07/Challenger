<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0c1016" />
  <title>이벤트 목록 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>
  try { if (localStorage.getItem("safety.mode") === "light") document.documentElement.dataset.mode = "light"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="mode_change.css" />
  <style>
    .main { grid-template-rows: auto minmax(0, 1fr); }
    .tbl-wrap { padding: 0 6px 6px; }
    .tbl .pick { width: 1%; padding-right: 0; }
    .tbl .pick input { cursor: pointer; }
    /* 페이지 번호는 가운데, 삭제 버튼은 맨 오른쪽 */
    .pager-line { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
    .pager-line .pagers { grid-column: 2; }
    .pager-line .row-tools { grid-column: 3; justify-self: end; display: flex; gap: 6px; padding-top: 10px; }
  </style>
</head>
<body>
  <div class="page full">
    <header class="cell head"></header>

    <main class="main">
      <section class="cell searchbar">
        <div class="searchbar-row">
          <b id="count">불러오는 중…</b>
          <button type="button" class="btn search-toggle" data-search-toggle aria-expanded="false" aria-controls="filter">검색 조건 <em class="search-sum" hidden></em><i class="chev">▾</i></button>
          <span class="muted">줄을 누르면 상세 화면으로 이동</span>
          <span class="grow"></span>
          <select class="input" id="sort" style="width:150px" aria-label="정렬"><option value="latest">최신순</option><option value="severity">심각도 높은 순</option><option value="confidence">신뢰도 높은 순</option></select>
          <a class="btn" href="event-snapshot.html">🖼 스냅샷으로 보기</a>
          <a class="btn primary" id="to-export" href="event-export.html">⬇ 내보내기</a>
        </div>
        <form class="search-panel" id="filter" hidden>
          <div class="search-fields">
            <label class="field">시작일<input class="input" type="date" id="f-from" /></label>
            <label class="field">끝일<input class="input" type="date" id="f-to" /></label>
            <label class="field">구역
              <select class="input" id="f-zone"><option value="">전체 구역</option></select>
            </label>
            <div class="field">심각도
              <div class="chips" id="f-severity"><span class="chip on" data-v="HIGH">높음</span><span class="chip on" data-v="MEDIUM">중간</span><span class="chip on" data-v="LOW">낮음</span></div>
            </div>
            <div class="field">처리 상태
              <div class="chips" id="f-status"><span class="chip on" data-v="NEW">미처리</span><span class="chip on" data-v="ACK">확인중</span><span class="chip on" data-v="DONE">처리완료</span><span class="chip" data-v="FALSE">오탐</span></div>
            </div>
            <div class="field wide">이벤트 종류
              <div class="chips" id="f-type"></div>
            </div>
          </div>
          <div class="row end">
            <button class="btn" type="button" id="reset">초기화</button>
            <button class="btn primary">검색</button>
          </div>
        </form>
      </section>
      <section class="cell tbl-wrap">
        <table class="tbl">
          <thead><tr><th class="pick" data-need="ADMIN"><input type="checkbox" id="pick-all" aria-label="이 페이지 전체 선택" /></th><th>번호</th><th>시각</th><th>카메라</th><th>구역</th><th>종류</th><th>심각도</th><th>신뢰도</th><th>처리 상태</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="pager-line">
          <div class="pagers" id="pagers"></div>
          <div class="row-tools" data-need="ADMIN">
            <button type="button" class="btn sm" id="del-range">전체 삭제</button>
            <button type="button" class="btn sm danger" id="del-picked" disabled>삭제</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    requireLogin();
    const $ = (id) => document.getElementById(id);
    const SIZE = 10;
    const chips = (box) => [...$(box).querySelectorAll(".chip")];
    const picked = (box) => chips(box).filter((c) => c.classList.contains("on")).map((c) => c.dataset.v);
    const toggleChip = (e) => { if (e.target.classList.contains("chip")) e.target.classList.toggle("on"); };
    let page = 1;
    let searched = { from: "", to: "" }; // 마지막으로 검색한 기간 (전체 삭제가 지울 범위)

    async function loadOptions() {
      const [zones, types] = await Promise.all([api("/api/work-zones"), api("/api/detection-types")]);
      $("f-zone").insertAdjacentHTML("beforeend", zones.map((z) => `<option value="${z.id}">${esc(z.name)}</option>`).join(""));
      $("f-type").innerHTML = types.map((t) => `<span class="chip on" data-v="${t.code}">${esc(t.label)}</span>`).join("");
    }

    // 검색 조건 버튼 옆 요약. 칩을 전부 고른 조건은 생략한다 (예: "2026.10.03 · 상태 미처리 외 2")
    function chipText(box) {
      const all = chips(box), on = all.filter((c) => c.classList.contains("on"));
      if (on.length === all.length) return "";
      if (!on.length) return "없음";
      return on.length <= 2 ? on.map((c) => c.textContent).join("·") : `${on[0].textContent} 외 ${on.length - 1}`;
    }
    function summary() {
      const type = chipText("f-type"), sev = chipText("f-severity"), st = chipText("f-status");
      return [
        rangeText($("f-from").value, $("f-to").value) || "전체 기간",
        $("f-zone").value && $("f-zone").selectedOptions[0].textContent,
        type && "종류 " + type,
        sev && "심각도 " + sev,
        "상태 " + (st || "전체"),
      ].filter(Boolean).join(" · ");
    }

    async function load() {
      searchSummary(summary());
      searched = { from: $("f-from").value, to: $("f-to").value };
      const types = picked("f-type"), sev = picked("f-severity"), st = picked("f-status");
      if (!types.length || !sev.length || !st.length) return render({ total: 0, items: [] });
      const from = $("f-from").value, to = $("f-to").value;
      // 내보내기 화면으로 지금 조건을 넘긴다 (칩을 전부 고른 조건은 생략)
      const pass = new URLSearchParams();
      if (from) pass.append("date_from", from);
      if (to) pass.append("date_to", to);
      if ($("f-zone").value) pass.append("work_zone_id", $("f-zone").value);
      [["detection_type", "f-type", types], ["severity", "f-severity", sev], ["status", "f-status", st]].forEach(([key, id, on]) => {
        if (on.length !== chips(id).length) on.forEach((v) => pass.append(key, v));
      });
      $("to-export").href = "event-export.html?" + pass;
      const data = await api("/api/events", { query: {
        date_from: from, date_to: to, work_zone_id: $("f-zone").value,
        detection_type: types, severity: sev, status: st,
        sort: $("sort").value, page, size: SIZE,
      } });
      render(data);
    }

    function render({ total, items }) {
      $("count").textContent = `검색 결과 ${total}건`;
      $("rows").innerHTML = items.length ? items.map((e) => {
        const conf = e.confidence == null ? "-" : Math.round(e.confidence * 100) + "%";
        return `<tr data-href="event-detail.html?id=${e.id}"><td class="pick" data-need="ADMIN"><input type="checkbox" value="${e.id}" aria-label="EV-${e.id} 선택" /></td><td class="num">EV-${e.id}</td><td class="num">${fmtTime(e.detected_at).slice(5)}</td>
          <td>${esc(e.camera_name || "-")}</td><td>${esc(e.work_zone_name || "-")}</td><td>${esc(e.detection_label)}</td>
          <td>${badge("severity", e.severity)}</td><td class="num">${conf}</td><td>${badge("eventStatus", e.status)}</td></tr>`;
      }).join("") : `<tr><td colspan="9" class="muted" style="text-align:center; padding:28px">조건에 맞는 이벤트가 없습니다</td></tr>`;
      $("rows").querySelectorAll("[data-href]").forEach((tr) => tr.addEventListener("click", (e) => {
        if (!e.target.closest(".pick")) location.href = tr.dataset.href; // 체크박스 칸은 상세로 넘어가지 않는다
      }));
      syncPicks();

      renderPagers($("pagers"), page, total, SIZE);
    }

    // ---- 삭제 (관리자 전용). 체크는 지금 페이지 안에서만 유지된다
    const pickBoxes = () => [...$("rows").querySelectorAll(".pick input")];
    const pickedIds = () => pickBoxes().filter((b) => b.checked).map((b) => Number(b.value));
    function syncPicks() {
      const boxes = pickBoxes(), n = pickedIds().length;
      $("pick-all").checked = boxes.length > 0 && n === boxes.length;
      $("pick-all").indeterminate = n > 0 && n < boxes.length;
      $("del-picked").disabled = !n;
      $("del-picked").textContent = n ? `삭제 (${n})` : "삭제";
    }
    $("pick-all").addEventListener("change", (e) => { pickBoxes().forEach((b) => { b.checked = e.target.checked; }); syncPicks(); });
    $("rows").addEventListener("change", (e) => { if (e.target.closest(".pick")) syncPicks(); });

    async function afterDelete({ deleted }) {
      toast(`이벤트 ${deleted}건을 삭제했습니다.`);
      eventsChanged(); // 헤더 알림 · 관제화면에서도 바로 빠진다
      await load();
      if (!pickBoxes().length && page > 1) { page -= 1; await load(); } // 마지막 페이지를 다 지웠으면 앞 페이지로
    }
    $("del-picked").addEventListener("click", () => {
      const ids = pickedIds();
      if (!ids.length || !confirm(`선택한 이벤트 ${ids.length}건을 삭제할까요? 처리 기록 · 스냅샷도 함께 지워지고 되돌릴 수 없습니다.`)) return;
      api("/api/events/delete", { method: "POST", body: { ids } }).then(afterDelete).catch((err) => toast(err.message));
    });
    // 검색한 기간(시작일 ~ 끝일)의 이벤트를 다른 조건과 상관없이 모두 지운다. 기본 기간은 오늘 하루
    $("del-range").addEventListener("click", () => {
      const { from, to } = searched;
      if (!from || !to) return toast("전체 삭제는 시작일 · 끝일을 모두 정해 검색한 뒤에 쓸 수 있습니다.");
      if (!confirm(`${rangeText(from, to)} 에 감지된 이벤트를 종류 · 심각도 · 상태와 상관없이 모두 삭제할까요? 처리 기록 · 스냅샷도 함께 지워지고 되돌릴 수 없습니다.`)) return;
      api("/api/events/range", { method: "DELETE", query: { date_from: from, date_to: to } }).then(afterDelete).catch((err) => toast(err.message));
    });

    const search = () => { page = 1; load().catch((err) => toast(err.message)); };
    $("filter").addEventListener("submit", (e) => { e.preventDefault(); closeSearch(); search(); });
    $("sort").addEventListener("change", search);
    $("f-type").addEventListener("click", toggleChip); // 심각도 · 상태 칩은 common.js 가 켜고 끈다 (종류 칩은 나중에 그려서 직접)
    $("pagers").addEventListener("click", (e) => {
      if (!e.target.dataset.p) return;
      page = Number(e.target.dataset.p);
      load().catch((err) => toast(err.message));
    });
    $("reset").addEventListener("click", () => {
      $("f-from").value = $("f-to").value = todayStr();
      syncRange();
      $("f-zone").value = "";
      document.querySelectorAll("#filter .chip").forEach((c) => c.classList.toggle("on", c.dataset.v !== "FALSE"));
    });

    $("f-from").value = $("f-to").value = todayStr();
    const syncRange = linkDateRange($("f-from"), $("f-to"));
    loadOptions().then(load).catch((err) => toast(err.message));
  </script>
</body>
</html>
