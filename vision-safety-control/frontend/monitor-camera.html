<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>카메라 상세 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>
  try { if (localStorage.getItem("safety.mode") === "light") document.documentElement.dataset.mode = "light"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="mode_change.css" />
  <style>
    .main { grid-template-rows: auto minmax(0, 1fr) auto; }
    .controls { padding: 12px 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; overflow: hidden; }
    /* 영상 비율 그대로 칸 가운데에 (ROI 좌표가 ROI 그리기 화면과 같은 기준이 되게) */
    .stage { position: absolute; z-index: 1; }
    .stage video, .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; background: #000; }
    .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .no-video { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; text-align: center; padding: 20px; color: #c5d0dc; font-size: 19px; font-weight: 700; background: rgba(8, 12, 18, 0.55); }
    .info-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 18px; }
    .info-row > span { color: var(--muted); font-weight: 700; white-space: nowrap; }
    .info-row b { text-align: right; overflow-wrap: anywhere; }
    .full-btn, .full-exit {
      height: 42px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line);
      background: #121820; color: var(--ink); font: inherit; font-size: 17.5px; font-weight: 700;
      white-space: nowrap; cursor: pointer;
    }
    .full-btn:hover, .full-exit:hover { border-color: rgba(255, 154, 31, 0.7); }
    .full-btn:focus-visible, .full-exit:focus-visible, .cam-pick:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }
    .full-bar {
      position: fixed; z-index: 45; top: 12px; right: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .full-exit { background: rgba(18, 24, 32, 0.88); }
    .cam-pick {
      height: 42px; min-width: 240px; max-width: min(460px, 70vw); padding: 0 10px; color-scheme: dark;
      border-radius: 9px; border: 1px solid var(--line); background: #121820; color: var(--ink);
      font: inherit; font-size: 18px; font-weight: 700;
    }
    .full-bar .cam-pick { height: 42px; min-width: 0; background: rgba(18, 24, 32, 0.88); font-size: 17.5px; }
    body.cam-full { overflow: hidden; }
    body.cam-full .gnb, body.cam-full .drawer, body.cam-full .scrim,
    body.cam-full .head, body.cam-full .pick-bar, body.cam-full .controls,
    body.cam-full .rail, body.cam-full .rail-toggle { display: none !important; }
    body.cam-full .page {
      position: fixed; inset: 0; z-index: 20; display: block;
      height: auto; margin: 0; padding: 0; background: #000;
    }
    body.cam-full .main { display: block; height: 100%; min-height: 0; }
    body.cam-full #cam-box { position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0; border-radius: 0; border: 0; box-shadow: none; }
    body.cam-full .cam-time { top: 52px; }
  </style>
</head>
<body>
  <div class="page no-left rail-hidden rail-over">
    <header class="cell head"></header>

    <main class="main">
      <section class="cell pick-bar">
        <div class="searchbar-row">
          <b class="now" id="now">카메라를 불러오는 중…</b>
          <select id="cam-pick" class="cam-pick" aria-label="카메라 선택"></select>
          <button class="full-btn" type="button" id="cam-full" aria-pressed="false">전체화면</button>
          <span class="grow"></span>
          <a class="btn" href="monitor.html">← 관제화면으로 돌아가기</a>
        </div>
      </section>
      <section class="cell cam" id="cam-box">
        <div class="scene" id="scene">
          <div class="ground-line"></div>
          <div class="bld" style="left:10%; width:22%; height:52%;"></div>
          <div class="mast" style="left:48%; height:64%;"></div>
          <div class="jib" style="left:48%; top:18%; width:34%;"></div>
        </div>
        <div class="stage" id="stage" hidden>
          <video id="video" muted loop playsinline autoplay></video>
          <img id="live" alt="YOLO 탐지 영상" hidden />
          <svg id="rois" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-label="ROI 구역"></svg>
        </div>
        <div class="no-video" id="no-video" hidden></div>
        <div class="cam-tag" id="cam-tag">-</div>
        <div class="cam-time js-cam-time"></div>
        <div class="cam-zone" id="cam-zone">-</div>
      </section>
      <section class="cell controls">
        <button class="btn" type="button" id="pause" disabled>⏸ 일시정지</button>
        <button class="btn" type="button" id="snap" disabled>📷 스냅샷 저장</button>
        <span class="chips"><span class="chip on" id="roi-toggle">ROI 표시</span><span class="chip on" id="box-toggle">탐지 박스 표시</span></span>
        <span class="muted" id="roi-sum"></span>
        <span class="grow"></span>
        <a class="btn" id="roi-edit" href="roi-draw.html" data-need="ADMIN">ROI 수정</a>
        <a class="btn primary" id="to-event" href="events.html" hidden>이 경보 상세 보기</a>
      </section>
    </main>

    <button type="button" class="rail-toggle rail-right" data-rail="right" aria-controls="rail" aria-expanded="false" title="오른쪽 패널 열기">◁</button>
    <aside class="cell right" id="rail">
      <div class="pad">
        <div class="label">카메라 정보</div>
        <div id="info"></div>
        <a class="btn block" id="to-edit" href="camera-edit.html">카메라 설정 보기</a>

        <div class="label" style="margin-top:6px">이 카메라의 최근 이벤트 <span>최근 5건</span></div>
        <div id="events" style="display:grid; gap:8px"></div>
        <a class="btn block" href="events.html">이벤트 목록에서 보기</a>
      </div>
    </aside>
  </div>
  <div class="full-bar" id="cam-fullbar" hidden>
    <select id="full-cam" class="cam-pick" aria-label="전체화면 카메라"></select>
    <button type="button" class="full-exit" id="cam-exit">전체화면 종료</button>
  </div>

  <script src="api.js"></script>
  <script src="roi-store.js"></script>
  <script src="common.js"></script>
  <script>
    requireLogin();
    const $ = (id) => document.getElementById(id);
    const TONE = { NEW: "stop", ACK: "warn", DONE: "ok", FALSE: "" };
    let cams = [], books = {}, cam = null;
    // live = 서버가 YOLO 탐지 박스 · ROI 를 그려 넣은 영상(MJPEG)을 보는 중. 못 쓰면 원본 영상 + 화면에서 ROI 를 그림
    let yolo = { enabled: false }, live = false, livePaused = false;

    // ?camera=번호, ?cam=CAM_0001 (이름), 관제화면의 ?cam=1~4 (1페이지 칸) · ?cam=tc1~4 (2페이지 칸)
    function wanted() {
      const p = new URLSearchParams(location.search);
      const id = Number(p.get("camera")), key = p.get("cam") || "";
      const slot = /^tc(\d)$/i.exec(key) ? [2, Number(key.slice(2))] : /^\d$/.test(key) ? [1, Number(key)] : null;
      return cams.find((c) => c.id === id) || cams.find((c) => c.name === key)
        || (slot && cams.find((c) => c.view_page === slot[0] && c.view_slot === slot[1]))
        || cams.find((c) => c.is_active && videoSrc(c.stream_url)) || cams[0];
    }

    // ---------------- 영상 + ROI
    function fitStage() {
      const box = $("cam-box").getBoundingClientRect();
      const [vw, vh] = live ? [$("live").naturalWidth, $("live").naturalHeight] : [$("video").videoWidth, $("video").videoHeight];
      if (!vw || !box.width) return;
      const s = Math.min(box.width / vw, box.height / vh), w = vw * s, h = vh * s;
      Object.assign($("stage").style, { width: w + "px", height: h + "px", left: (box.width - w) / 2 + "px", top: (box.height - h) / 2 + "px" });
    }
    new ResizeObserver(fitStage).observe($("cam-box"));

    // 지금 영상 시각에 맞는 모양 (ROI 그리기에서 프레임마다 바꿔 둔 경우). 탐지 영상은 서버가 ROI 를 그려서 보낸다
    function drawRois() {
      const list = (cam && books[roiFileOf(cam)]) || [];
      const show = $("roi-toggle").classList.contains("on");
      const t = $("video").currentTime || 0;
      $("roi-sum").textContent = list.length ? `ROI ${list.length}개${list.some((r) => r.enabled === false) ? ` (꺼짐 ${list.filter((r) => r.enabled === false).length})` : ""}` : "그려진 ROI 없음";
      $("rois").innerHTML = !show || live ? "" : list.filter((r) => r.enabled !== false).map((r) => {
        let key = r.keys[0];
        r.keys.forEach((k) => { if ((k.time ?? k.frame / 30) <= t) key = k; });
        if (!key || key.pts.length < 3) return "";
        const color = ROI_KINDS[r.kind].color, pts = key.pts.map((q) => q.join(",")).join(" ");
        const c = key.pts.reduce((a, q) => [a[0] + q[0] / key.pts.length, a[1] + q[1] / key.pts.length], [0, 0]);
        return `<polygon points="${pts}" fill="${color}" fill-opacity="0.18" stroke="${color}" stroke-width="3" stroke-dasharray="12 7" />
          <text x="${c[0]}" y="${c[1]}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="31" font-weight="800" stroke="#0c1016" stroke-width="5" paint-order="stroke">${r.no} ${escHtml(roiName(r))}</text>`;
      }).join("");
    }
    $("video").addEventListener("timeupdate", drawRois);
    $("video").addEventListener("loadedmetadata", fitStage);
    $("video").addEventListener("playing", () => { $("scene").style.visibility = "hidden"; $("pause").textContent = "⏸ 일시정지"; });
    $("video").addEventListener("pause", () => { $("pause").textContent = "▶ 다시 재생"; });
    $("video").addEventListener("error", () => noVideo("영상을 재생할 수 없습니다. 이 PC 의 브라우저가 못 여는 형식(H.265 등)일 수 있습니다."));

    function noVideo(text) {
      stopLive();
      const v = $("video");
      v.pause();
      v.removeAttribute("src");
      v.load();
      $("stage").hidden = true;
      $("scene").style.visibility = "";
      $("no-video").hidden = false;
      $("no-video").textContent = text;
      $("pause").disabled = $("snap").disabled = true;
      $("pause").textContent = "⏸ 일시정지";
    }

    function play(c) {
      stopLive();
      if (yolo.enabled && c.stream_url) return playLive(c);
      playFile(c);
    }

    // ---------------- YOLO 탐지 영상
    function stopLive() {
      live = livePaused = false;
      $("live").removeAttribute("src"); // 주소를 빼면 서버와의 연결이 끊긴다
      $("live").hidden = true;
      $("video").hidden = false;
    }

    function playLive(c) {
      const v = $("video");
      v.pause();
      v.removeAttribute("src");
      v.load();
      v.hidden = true;
      $("live").hidden = false;
      $("no-video").hidden = true;
      $("stage").hidden = false;
      $("pause").disabled = $("snap").disabled = false;
      live = true;
      connectLive();
      drawRois();
    }

    // 새 <img> 로 바꿔 끼워 연결한다 (같은 <img> 는 이전 영상 크기가 남아 첫 장면을 알 수 없음)
    function connectLive() {
      const old = $("live"), img = old.cloneNode();
      old.removeAttribute("src");
      old.replaceWith(img);
      livePaused = false;
      $("pause").textContent = "⏸ 일시정지";
      img.src = detectSrc(cam, $("roi-toggle").classList.contains("on"), $("box-toggle").classList.contains("on"));
      const forCam = cam;
      waitFirstFrame(img).then(() => { fitStage(); $("scene").style.visibility = "hidden"; }).catch(() => {
        if (cam !== forCam || $("live") !== img || !img.getAttribute("src")) return; // 그 사이 다른 카메라 · 다시 연결
        stopLive();
        drawRois();
        playFile(cam, "탐지 영상을 받지 못해 원본 영상을 보여 줍니다.");
      });
    }

    // 일시정지: 지금 장면을 그림으로 바꿔 두고 연결을 끊는다. 다시 재생하면 새로 연결
    function pauseLive() {
      const img = $("live");
      if (!img.naturalWidth) return;
      const canvas = Object.assign(document.createElement("canvas"), { width: img.naturalWidth, height: img.naturalHeight });
      canvas.getContext("2d").drawImage(img, 0, 0);
      img.src = canvas.toDataURL("image/jpeg", 0.92);
      livePaused = true;
      $("pause").textContent = "▶ 다시 재생";
    }

    function playFile(c, why) {
      const src = videoSrc(c.stream_url);
      if (!src) {
        return noVideo(!c.stream_url ? "이 카메라에는 영상 소스가 없습니다. 카메라 등록에서 연결하세요."
          : `RTSP 카메라는 YOLO 탐지 영상으로만 볼 수 있습니다. ${why || yolo.reason || ""}`);
      }
      if (why) toast(why);
      $("no-video").hidden = true;
      $("stage").hidden = false;
      $("pause").disabled = $("snap").disabled = false;
      const v = $("video");
      v.src = src;
      v.play().catch(() => document.addEventListener("pointerdown", () => v.play().catch(() => {}), { once: true }));
    }

    // ---------------- 오른쪽: 카메라 정보 · 최근 이벤트
    async function side(c) {
      const row = (k, v) => `<div class="info-row"><span>${k}</span><b>${v}</b></div>`;
      $("info").innerHTML = row("설치 위치", esc([c.work_zone_name, c.location_desc].filter(Boolean).join(" · ") || "-"))
        + row("종류", c.camera_type === "TC" ? "TC CAM (크레인 부착)" : "현장 CAM")
        + row("관제화면", c.view_slot ? `${c.view_page}페이지 ${c.view_slot}번 칸` : "표시 안 함")
        + row("영상", videoSrc(c.stream_url) ? "📁 " + esc(c.stream_url.slice(7)) : c.stream_url ? "RTSP" : "-")
        + row("화면", yolo.enabled ? `YOLO 탐지 영상 (${esc(yolo.model)})` : `원본 영상 <small class="muted">${esc(yolo.reason || "")}</small>`)
        + row("사용", c.is_active ? '<span class="status ok">사용</span>' : '<span class="status mute">사용 안 함</span>');
      $("to-edit").href = "camera-edit.html?id=" + c.id;
      $("roi-edit").href = "roi-draw.html?camera=" + c.id;
      const page = await api("/api/events", { query: { camera_id: c.id, size: 5 } });
      if (cam !== c) return; // 그 사이 다른 카메라를 골랐으면 버린다
      $("events").innerHTML = page.items.length ? page.items.map((e) => `<a class="item ${TONE[e.status]}" href="event-detail.html?id=${e.id}">
          <div class="item-top"><b>${esc(e.detection_label)}</b>${badge("severity", e.severity)}</div>
          <div class="desc">${fmtTime(e.detected_at).slice(5, 16)} · ${LABEL.eventStatus[e.status][1]}</div></a>`).join("")
        : '<p class="muted">이 카메라의 이벤트가 없습니다</p>';
      const open = page.items.find((e) => e.status === "NEW" || e.status === "ACK");
      $("to-event").hidden = !open;
      if (open) $("to-event").href = "event-detail.html?id=" + open.id;
    }

    function fillPicks() {
      const groups = [["1페이지 · 현장 CAM", (c) => c.view_page === 1 && c.view_slot], ["2페이지 · TC 관제 CAM", (c) => c.view_page === 2 && c.view_slot],
        ["관제화면에 안 나오는 카메라", (c) => !c.view_slot]];
      const html = groups.map(([title, test]) => {
        const list = cams.filter(test);
        if (!list.length) return "";
        return `<optgroup label="${esc(title)}">` + list.map((c) =>
          `<option value="${c.id}">${esc(c.name)}${c.work_zone_name ? " · " + esc(c.work_zone_name) : ""}</option>`).join("") + "</optgroup>";
      }).join("") || `<option value="" disabled>등록된 카메라가 없습니다</option>`;
      $("cam-pick").innerHTML = html;
      $("full-cam").innerHTML = html;
    }

    function show(c) {
      cam = c;
      history.replaceState(null, "", "?camera=" + c.id);
      ["cam-pick", "full-cam"].forEach((id) => { if ($(id).value !== String(c.id)) $(id).value = String(c.id); });
      $("now").innerHTML = `${esc(c.name)}<small>${esc(c.work_zone_name || "구역 없음")}</small>`;
      $("cam-tag").textContent = c.name;
      $("cam-zone").textContent = [c.work_zone_name, c.location_desc].filter(Boolean).join(" · ") || "설치 위치 없음";
      play(c);
      drawRois();
      side(c).catch((err) => toast(err.message));
    }

    function setCamFull(on) {
      document.body.classList.toggle("cam-full", on);
      $("cam-fullbar").hidden = !on;
      $("cam-full").setAttribute("aria-pressed", on ? "true" : "false");
      const root = document.documentElement;
      if (on && !document.fullscreenElement && root.requestFullscreen) root.requestFullscreen().catch(() => {});
      else if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
      setTimeout(fitStage, 50);
      setTimeout(fitStage, 280);
    }
    $("cam-full").addEventListener("click", () => setCamFull(true));
    $("cam-exit").addEventListener("click", () => setCamFull(false));
    document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) setCamFull(false); });
    function onPick(e) {
      const next = cams.find((c) => c.id === Number(e.target.value));
      if (next && next !== cam) show(next);
    }
    $("cam-pick").addEventListener("change", onPick);
    $("full-cam").addEventListener("change", onPick);
    // 관제화면에서 ROI · 박스를 숨겨 두었으면 여기서도 꺼진 채로 연다
    if (!overlayShown()) ["roi-toggle", "box-toggle"].forEach((id) => $(id).classList.remove("on"));
    $("roi-toggle").addEventListener("click", () => { // 칩 켜고 끄기는 common.js 가 한다
      drawRois();
      if (live && !livePaused) connectLive(); // 탐지 영상은 ROI 를 넣고 빼서 다시 받는다
    });
    $("box-toggle").addEventListener("click", () => { // 박스를 빼도 탐지 · 이벤트 판정은 서버에서 그대로
      if (live && !livePaused) connectLive();
    });
    $("pause").addEventListener("click", () => {
      if (live) return livePaused ? connectLive() : pauseLive();
      const v = $("video");
      if (v.paused) v.play().catch(() => {}); else v.pause();
    });
    // 스냅샷: 지금 화면(영상 원래 크기)을 PNG 로 내려받기. ROI 를 켜 두었으면 함께 그린다 (탐지 영상은 이미 들어 있음)
    $("snap").addEventListener("click", async () => {
      const v = live ? $("live") : $("video");
      const [vw, vh] = live ? [v.naturalWidth, v.naturalHeight] : [v.videoWidth, v.videoHeight];
      if (!vw) return toast("영상이 아직 열리지 않았습니다.");
      const canvas = Object.assign(document.createElement("canvas"), { width: vw, height: vh });
      const ctx = canvas.getContext("2d");
      ctx.drawImage(v, 0, 0);
      if ($("rois").innerHTML) {
        const svg = new Blob([new XMLSerializer().serializeToString($("rois"))], { type: "image/svg+xml" });
        const img = new Image();
        img.src = URL.createObjectURL(svg);
        await img.decode().catch(() => {});
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(img.src);
      }
      const stamp = new Date().toTimeString().slice(0, 8).replaceAll(":", "");
      canvas.toBlob((blob) => {
        const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: `${cam.name}_${todayStr()}_${stamp}.png` });
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        toast("스냅샷을 저장했습니다.");
      }, "image/png");
    });

    (async () => {
      [cams, yolo] = await Promise.all([api("/api/cameras"), detectStatus()]);
      books = await loadRoiBooks(cams).catch(() => ({})); // ROI 를 못 불러와도 영상은 본다
      if (!cams.length) {
        $("now").textContent = "등록된 카메라가 없습니다";
        fillPicks();
        return noVideo("등록된 카메라가 없습니다. 카메라 등록에서 먼저 추가하세요.");
      }
      fillPicks();
      show(wanted());
    })().catch((err) => toast(err.message));
  </script>
</body>
</html>
