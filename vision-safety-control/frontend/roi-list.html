<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>구역 목록 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    .main { grid-template-rows: auto minmax(0, 1fr); }
    .mini-cam { position: relative; width: 128px; height: 72px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: #000; }
    .mini-cam video { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: contain; background: #000; pointer-events: none; }
    .mini-cam svg { position: absolute; inset: 0; z-index: 3; width: 100%; height: 100%; pointer-events: none; }
    .tbl td { vertical-align: middle; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
    [data-set] { position: relative; }
    [data-set] .new-dot { position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: #ff5d5d; box-shadow: 0 0 0 3px rgba(255, 93, 93, 0.28); }
    #roi-empty td { text-align: center; color: var(--muted); font-weight: 700; padding: 28px 12px; }
    .sched-time { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
    .sched-time .input { width: 120px; }
    #sched-pop .pop-card { width: min(440px, 100%); }
    #sched-days.is-off { opacity: 0.45; pointer-events: none; }
  </style>
</head>
<body>
  <div class="page full">

    <header class="cell head"></header>

    <main class="main">
      <section class="cell searchbar">
        <div class="searchbar-row">
          <input class="input" id="q" style="width:240px" placeholder="구역 이름으로 찾기" />
          <button type="button" class="btn search-toggle" data-search-toggle aria-expanded="false">검색 조건 <em class="search-sum" hidden></em><i class="chev">▾</i></button>
          <span class="muted">줄을 누르면 규칙 화면, 스위치로 켜고 끄기</span>
          <span class="grow"></span>
          <a class="btn primary" href="roi-draw.html">＋ 새 구역 그리기</a>
        </div>
        <div class="search-panel" id="filter" hidden>
          <div class="search-fields">
            <div class="field wide">카메라
              <div class="chips" id="f-cam"><span class="chip on" data-v="">전체</span><span class="chip" data-v="CAM_0001">CAM_0001</span><span class="chip" data-v="CAM_0002">CAM_0002</span><span class="chip" data-v="CAM_0003">CAM_0003</span><span class="chip" data-v="CAM_0004">CAM_0004</span></div>
            </div>
            <div class="field">사용
              <div class="chips" id="f-use"><span class="chip on" data-v="">전체</span><span class="chip" data-v="on">활성화</span><span class="chip" data-v="off">비활성화</span></div>
            </div>
            <div class="field wide">종류
              <div class="chips" id="f-kind"><span class="chip on" data-v="">전체</span><span class="chip" data-v="위험구역">위험구역</span><span class="chip" data-v="통제구역">통제구역</span><span class="chip" data-v="관리구역">관리구역</span><span class="chip" data-v="안전구역">안전구역</span></div>
            </div>
          </div>
          <div class="row end"><button class="btn" type="button" id="reset">초기화</button><button class="btn primary" type="button" data-search-close>닫기</button></div>
        </div>
      </section>
      <section class="cell" style="padding:0 6px 6px">
        <table class="tbl">
          <thead><tr><th>미리보기</th><th>구역 이름</th><th>카메라</th><th>종류</th><th>규칙</th><th>이번 주 이벤트</th><th>사용</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </main>
  </div>
  <div class="pop" id="del-pop" hidden>
    <div class="pop-card" role="dialog" aria-modal="true" aria-labelledby="del-title">
      <div class="pop-head">
        <div>
          <div class="label">구역 삭제</div>
          <h2 id="del-title">정말 삭제하시겠습니까?</h2>
          <p id="del-sub">예를 누르면 이 구역이 목록과 roi-zones.json 에서 지워지고 되돌릴 수 없습니다.</p>
        </div>
      </div>
      <div class="row end" style="margin-top:16px">
        <button class="btn" type="button" data-close>아니오</button>
        <button class="btn danger" type="button" id="del-yes">예</button>
      </div>
    </div>
  </div>
  <div class="pop" id="sched-pop" hidden>
    <div class="pop-card" role="dialog" aria-modal="true" aria-labelledby="sched-title">
      <div class="pop-head">
        <div>
          <div class="label">적용 시간</div>
          <h2 id="sched-title">구역</h2>
          <p>이 시간에만 구역이 활성화됩니다</p>
        </div>
        <span class="switch on" id="sched-on" title="적용 시간 사용"></span>
      </div>
      <div class="pop-body">
        <div class="sched-time"><input class="input" id="sched-start" type="time" value="00:00" /> ~ <input class="input" id="sched-end" type="time" value="23:59" /></div>
        <div class="chips" id="sched-days">
          <span class="chip on" data-day="월">월</span><span class="chip on" data-day="화">화</span><span class="chip on" data-day="수">수</span><span class="chip on" data-day="목">목</span><span class="chip on" data-day="금">금</span><span class="chip on" data-day="토">토</span><span class="chip on" data-day="일">일</span>
        </div>
        <div class="row end"><button class="btn" type="button" data-close>닫기</button><button class="btn primary" type="button" id="sched-save">저장</button></div>
      </div>
    </div>
  </div>
  <script src="common.js"></script>
  <script>
    const STORE_KEY = "safety.roi-draw";
    const CAMS = {
      "Construction_A.mp4": { code: "CAM_0001", title: "101동 갱폼 인양구역" },
      "Construction_B.mp4": { code: "CAM_0002", title: "102동 대형거푸집구역" },
      "Construction_C.mp4": { code: "CAM_0003", title: "Sector A 토공" },
      "Construction_D.mp4": { code: "CAM_0004", title: "외곽 야적장" },
    };
    const KINDS = {
      danger: { label: "위험구역", color: "#ff5d5d" },
      control: { label: "통제구역", color: "#ff9a1f" },
      manage: { label: "관리구역", color: "#6cb6ff" },
      safe: { label: "안전구역", color: "#3ddc84" },
    };
    let books = {};
    const esc = (value) => String(value).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
    function loadBooks() {
      books = {};
      try {
        const saved = JSON.parse(sessionStorage.getItem(STORE_KEY) || "{}");
        Object.keys(saved).forEach((file) => { books[file] = saved[file]; });
      } catch (e) { books = {}; }
    }
    function exportZones() {
      const rows = [];
      Object.keys(books).forEach((file) => {
        const cam = CAMS[file];
        if (!cam) return;
        (books[file] || []).forEach((roi) => {
          const kind = KINDS[roi.kind];
          if (!kind) return;
          (roi.keys || []).forEach((key) => {
            if (!key.pts || key.pts.length < 3) return;
            const row = {
              camera: cam.code,
              cameraName: cam.title,
              no: roi.no,
              kind: kind.label,
              frame: key.frame + 1,
              points: key.pts,
            };
            if (roi.schedule) row.schedule = roi.schedule;
            rows.push(row);
          });
        });
      });
      rows.sort((a, b) => a.camera.localeCompare(b.camera) || a.no - b.no || a.frame - b.frame);
      return rows;
    }
    function persist() {
      try { sessionStorage.setItem(STORE_KEY, JSON.stringify(books)); } catch (e) { /* 화면 저장이 실패해도 파일 기록은 시도한다 */ }
      return fetch("/api/roi-zones", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(exportZones()),
      }).then((res) => res.ok).catch(() => false);
    }
    function candidateUrls(file) {
      const name = encodeURIComponent(file);
      const stored = new URL("../storage/videos/" + name, document.baseURI).href;
      const mounted = new URL("videos/" + name, document.baseURI).href;
      if (location.protocol === "file:") return [mounted, stored];
      if (location.pathname.includes("/frontend/")) return [stored, mounted];
      return [mounted, stored];
    }
    function latestKey(roi) {
      return roi.keys && roi.keys.length ? roi.keys[roi.keys.length - 1] : null;
    }
    function showClip(video) {
      const urls = candidateUrls(video.dataset.file);
      const time = Number(video.dataset.time);
      let index = 0;
      const load = () => { if (index < urls.length) video.src = urls[index++]; };
      video.addEventListener("error", load);
      video.addEventListener("loadeddata", () => {
        video.removeEventListener("error", load);
        if (Number.isFinite(time) && Math.abs(video.currentTime - time) > 0.008) {
          video.addEventListener("seeked", () => video.pause(), { once: true });
          try { video.currentTime = time; } catch (e) { video.pause(); }
        } else video.pause();
      }, { once: true });
      load();
    }
    const DAY_ORDER = ["월", "화", "수", "목", "금", "토", "일"];
    const SCHEDULE_DEFAULT = { on: true, start: "00:00", end: "23:59", days: ["월", "화", "수", "목", "금", "토", "일"] };
    function scheduleText(roi) {
      const s = roi.schedule;
      if (!s || s.on === false) return "항상";
      const days = DAY_ORDER.filter((day) => (s.days || []).includes(day));
      const when = days.length === 7 ? "매일" : days.join("");
      return when ? `${when} ${s.start}–${s.end}` : "요일 없음";
    }
    function syncScheduleForm() {
      const on = document.getElementById("sched-on").classList.contains("on");
      document.getElementById("sched-start").disabled = !on;
      document.getElementById("sched-end").disabled = !on;
      document.getElementById("sched-days").classList.toggle("is-off", !on);
    }
    let pendingDelete = null;
    function askDelete(file, roi) {
      pendingDelete = { file, uid: roi.uid, no: roi.no };
      document.getElementById("del-sub").textContent = `${roi.no}번 ${KINDS[roi.kind].label}이 목록과 roi-zones.json 에서 지워지고 되돌릴 수 없습니다.`;
      document.getElementById("del-pop").hidden = false;
    }
    let editingSchedule = null;
    function openSchedule(file, roi) {
      const s = roi.schedule || SCHEDULE_DEFAULT;
      const days = new Set(s.days || []);
      editingSchedule = { file, roi };
      document.getElementById("sched-title").textContent = `${roi.no}번 ${KINDS[roi.kind].label}`;
      document.getElementById("sched-on").classList.toggle("on", s.on !== false);
      document.getElementById("sched-start").value = s.start || "00:00";
      document.getElementById("sched-end").value = s.end || "23:59";
      document.querySelectorAll("#sched-days .chip").forEach((chip) => chip.classList.toggle("on", days.has(chip.dataset.day)));
      syncScheduleForm();
      document.getElementById("sched-pop").hidden = false;
    }
    const chosen = (id) => [...document.querySelectorAll("#" + id + " .chip")].slice(1)
      .filter((chip) => chip.classList.contains("on"))
      .map((chip) => chip.dataset.v);
    function settle(box, chip) {
      const chips = [...box.querySelectorAll(".chip")];
      const all = chips[0];
      if (chip === all) chips.forEach((item) => item.classList.toggle("on", item === all));
      else {
        all.classList.remove("on");
        if (!chips.slice(1).some((item) => item.classList.contains("on"))) all.classList.add("on");
      }
    }
    function entries() {
      const rows = [];
      Object.keys(books).forEach((file) => {
        const cam = CAMS[file];
        if (!cam) return;
        (books[file] || []).forEach((roi) => {
          const key = latestKey(roi);
          const kind = KINDS[roi.kind];
          if (!key || !kind || !key.pts || key.pts.length < 3) return;
          rows.push({ file, cam, roi, key, kind });
        });
      });
      rows.sort((a, b) => a.cam.code.localeCompare(b.cam.code) || a.roi.no - b.roi.no);
      return rows;
    }
    function paint() {
      const body = document.getElementById("rows");
      const list = entries();
      body.innerHTML = list.map(({ file, cam, roi, key, kind }) => {
        const name = `${roi.no}번 ${kind.label}`;
        const points = key.pts.map((p) => p.join(",")).join(" ");
        const time = key.time != null ? key.time : key.frame / 30;
        const on = roi.enabled !== false;
        const isNew = !roi.schedule;
        const dot = isNew ? `<i class="new-dot" title="설정을 아직 저장하지 않은 구역"></i>` : "";
        return `<tr data-href="roi-rules.html" data-file="${esc(file)}" data-uid="${roi.uid}" data-cam="${cam.code}" data-kind="${esc(kind.label)}" data-name="${esc(name)}"${isNew ? ' class="is-new"' : ""}>
          <td><div class="mini-cam"><video muted playsinline preload="auto" data-file="${esc(file)}" data-time="${time}"></video><svg viewBox="0 0 1000 600" preserveAspectRatio="none"><polygon points="${points}" fill="${kind.color}" fill-opacity="0.28" stroke="${kind.color}" stroke-width="28" /></svg></div></td>
          <td><b><span class="swatch" style="background:${kind.color}"></span>${esc(name)}</b><br><small class="muted">${esc(cam.title)}</small></td>
          <td>${cam.code}</td>
          <td>${esc(kind.label)}</td>
          <td class="rule-cell">${esc(scheduleText(roi))}<br><small class="muted">프레임 ${key.frame + 1}부터</small></td>
          <td>-</td>
          <td><span class="switch${on ? " on" : ""}"></span></td>
          <td><button type="button" class="btn sm" data-set style="margin-right:10px">설정${dot}</button><a class="btn sm" href="roi-draw.html?cam=${cam.code}&uid=${roi.uid}">수정</a> <button type="button" class="mini-btn" data-del="${roi.uid}">삭제</button></td>
        </tr>`;
      }).join("") + `<tr id="roi-empty" hidden><td colspan="8">조건에 맞는 구역이 없습니다</td></tr>`;
      body.querySelectorAll("video[data-file]").forEach(showClip);
      apply();
      const marked = body.querySelector("tr.is-new");
      if (marked) marked.scrollIntoView({ block: "nearest" });
    }
    function apply() {
      const cams = chosen("f-cam");
      const uses = chosen("f-use");
      const kinds = chosen("f-kind");
      const q = document.getElementById("q").value.trim();
      let shown = 0;
      document.querySelectorAll("#rows tr[data-cam]").forEach((row) => {
        const use = row.querySelector(".switch").classList.contains("on") ? "on" : "off";
        const ok = (!cams.length || cams.includes(row.dataset.cam))
          && (!uses.length || uses.includes(use))
          && (!kinds.length || kinds.includes(row.dataset.kind))
          && (!q || row.dataset.name.includes(q));
        row.hidden = !ok;
        if (ok) shown += 1;
      });
      const empty = document.getElementById("roi-empty");
      empty.hidden = shown > 0;
      empty.querySelector("td").textContent = entries().length ? "조건에 맞는 구역이 없습니다" : "저장된 구역이 없습니다";
      const labels = ["f-cam", "f-use", "f-kind"].flatMap((id) => [...document.querySelectorAll("#" + id + " .chip")].slice(1)
        .filter((chip) => chip.classList.contains("on"))
        .map((chip) => chip.textContent.trim()));
      searchSummary([q, ...labels].filter(Boolean).join(" · "));
    }
    document.getElementById("filter").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      settle(chip.closest(".chips"), chip);
      apply();
    });
    document.getElementById("q").addEventListener("input", apply);
    document.getElementById("rows").addEventListener("click", (e) => {
      const row = e.target.closest("tr[data-uid]");
      if (!row) return;
      const file = row.dataset.file;
      const uid = Number(row.dataset.uid);
      const list = books[file] || [];
      const roi = list.find((item) => item.uid === uid);
      if (e.target.closest("[data-set]")) {
        if (roi) openSchedule(file, roi);
        return;
      }
      if (e.target.closest(".switch")) {
        if (!roi) return;
        const sw = row.querySelector(".switch");
        sw.classList.toggle("on");
        roi.enabled = sw.classList.contains("on");
        persist();
        apply();
        return;
      }
      const del = e.target.closest("[data-del]");
      if (del) {
        if (roi) askDelete(file, roi);
        return;
      }
      if (e.target.closest("a, button")) return;
      location.href = row.dataset.href;
    });
    document.getElementById("del-pop").addEventListener("click", (e) => {
      if (e.target.closest("#del-yes")) return;
      if (e.target.id === "del-pop" || e.target.closest("[data-close]")) pendingDelete = null;
    });
    document.getElementById("del-yes").addEventListener("click", () => {
      const pending = pendingDelete;
      pendingDelete = null;
      document.getElementById("del-pop").hidden = true;
      if (!pending) return;
      const list = books[pending.file] || [];
      const index = list.findIndex((item) => item.uid === pending.uid);
      if (index < 0) return;
      list.splice(index, 1);
      if (!list.length) delete books[pending.file];
      persist().then((ok) => toast(ok ? `${pending.no}번 구역을 삭제했습니다.` : `${pending.no}번 구역을 목록에서 지웠습니다. 서버를 켠 뒤에 다시 저장하면 roi-zones.json 에도 반영됩니다.`));
      paint();
    });
    document.getElementById("sched-on").addEventListener("click", syncScheduleForm);
    document.getElementById("sched-save").addEventListener("click", () => {
      const roi = editingSchedule && editingSchedule.roi;
      if (!roi) return;
      const on = document.getElementById("sched-on").classList.contains("on");
      roi.schedule = {
        on,
        start: document.getElementById("sched-start").value || "00:00",
        end: document.getElementById("sched-end").value || "23:59",
        days: [...document.querySelectorAll("#sched-days .chip.on")].map((chip) => chip.dataset.day),
      };
      persist();
      const row = document.querySelector(`#rows tr[data-file="${editingSchedule.file}"][data-uid="${roi.uid}"]`);
      const cell = row && row.querySelector(".rule-cell");
      const key = latestKey(roi);
      if (cell && key) cell.innerHTML = `${esc(scheduleText(roi))}<br><small class="muted">프레임 ${key.frame + 1}부터</small>`;
      if (row) {
        row.classList.remove("is-new");
        const mark = row.querySelector(".new-dot");
        if (mark) mark.remove();
      }
      document.getElementById("sched-pop").hidden = true;
      toast(on ? "적용 시간을 저장했습니다." : "구역을 항상 활성화했습니다.");
    });
    document.getElementById("reset").addEventListener("click", () => {
      document.getElementById("q").value = "";
      document.querySelectorAll("#filter .chips").forEach((box) => {
        [...box.querySelectorAll(".chip")].forEach((chip, index) => chip.classList.toggle("on", index === 0));
      });
      apply();
    });
    loadBooks();
    paint();
    window.addEventListener("pageshow", (e) => {
      if (!e.persisted) return;
      loadBooks();
      paint();
    });
  </script>
</body>
</html>
