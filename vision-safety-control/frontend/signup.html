<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>회원가입 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>
  try { if (localStorage.getItem("safety.mode") === "light") document.documentElement.dataset.mode = "light"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="mode_change.css" />
  <style>
    body { align-items: center; justify-content: center; padding: 16px; overflow: auto; }
    .signup { width: min(520px, 100%); display: grid; gap: 14px; padding: 28px; margin: auto; }
    .signup .brand { justify-content: center; font-size: 22px; margin: 0; }
    .signup .brand i { width: 30px; height: 30px; font-size: 16px; }
    .signup .site { text-align: center; color: var(--muted); font-size: 13px; margin-top: -6px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .signup .input { padding: 10px 12px; font-size: 14px; }
    .signup .btn.primary { padding: 12px; font-size: 15px; }
    .err { font-size: 12px; color: #ff9b9b; font-weight: 700; min-height: 16px; }
    .done { text-align: center; display: grid; gap: 12px; }
    .done .big { font-size: 40px; }
    .done h2 { font-size: 22px; letter-spacing: -0.03em; }
    .done p { color: var(--muted); font-size: 13.5px; line-height: 1.6; }
    @media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-no-gnb>
  <form class="cell signup" id="form" novalidate>
    <div class="brand"><i>▲</i>안전관제</div>
    <div class="site">회원가입 신청 · 관리자가 승인하면 로그인할 수 있습니다</div>

    <div class="two">
      <label class="field">이름<input class="input" id="su-name" placeholder="예: 홍길동" autocomplete="name" /></label>
      <label class="field">직급<input class="input" id="su-rank" placeholder="예: 대리" /></label>
    </div>
    <label class="field">아이디<input class="input" id="su-id" placeholder="영문 소문자 · 숫자 · 점(.) 4~20자" autocomplete="username" /></label>
    <div class="two">
      <label class="field">비밀번호<input class="input" id="su-pw" type="password" placeholder="8자 이상" autocomplete="new-password" /></label>
      <label class="field">비밀번호 확인<input class="input" id="su-pw2" type="password" autocomplete="new-password" /></label>
    </div>
    <label class="field">휴대폰<input class="input" id="su-phone" placeholder="010-0000-0000" autocomplete="tel" /></label>
    <div class="two">
      <label class="field">소속 회사
        <select class="input" id="su-company"><option value="">불러오는 중…</option></select>
      </label>
      <label class="field">부서<select class="input" id="su-dept"><option value="">부서 없음</option></select></label>
    </div>
    <label class="field">요청 역할
      <select class="input" id="su-role">
        <option value="MANAGER">안전관리자 · 관제화면 보기, 이벤트 처리, 작업자 관리</option>
        <option value="VIEWER">조회 전용 · 화면 보기만</option>
      </select>
    </label>
    <label class="row muted" style="gap:6px; font-size:12.5px"><input type="checkbox" id="su-agree" /> 개인정보 수집 · 이용에 동의합니다 (이름 · 연락처 · 소속)</label>
    <div class="err" id="err" role="alert"></div>
    <button class="btn primary">가입 신청</button>
    <div class="row between muted" style="font-size:12.5px"><span>이미 계정이 있나요?</span><a href="login.html" style="color:var(--orange); font-weight:700">로그인으로 →</a></div>
  </form>

  <section class="cell signup done" id="done" hidden>
    <div class="big">✅</div>
    <h2>가입 신청을 보냈습니다</h2>
    <p><b id="done-name">홍길동</b>님의 신청이 관리자에게 전달됐습니다.<br>관리자가 <b>회원가입 승인</b> 화면에서 승인하면 로그인할 수 있습니다.</p>
    <a class="btn primary" href="login.html">로그인 화면으로</a>
    <a class="muted" style="font-size:12.5px" href="user-approval.html">(시연용) 관리자 승인 화면 보기 →</a>
  </section>

  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const opt = (value, text) => `<option value="${value}">${text}</option>`;
    let orgs = [];

    // 회사 · 부서 목록은 관리자 > 조직 · 부서 관리에서 만든 것을 그대로 쓴다
    api("/api/orgs").then((list) => {
      orgs = list;
      $("su-company").innerHTML = list.filter((o) => o.type === "COMPANY")
        .map((o) => opt(o.id, o.name + (o.is_prime ? " (원청)" : ""))).join("");
      fillDepts();
    }).catch((err) => { $("err").textContent = "회사 목록을 불러오지 못했습니다. " + err.message; });

    function fillDepts() {
      const company = Number($("su-company").value);
      $("su-dept").innerHTML = opt("", "부서 없음") +
        orgs.filter((o) => o.parent_id === company).map((o) => opt(o.id, o.name)).join("");
    }
    $("su-company").addEventListener("change", fillDepts);

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = $("su-name").value.trim();
      const id = $("su-id").value.trim();
      const pw = $("su-pw").value;
      let msg = "";
      if (!name) msg = "이름을 입력하세요.";
      else if (!/^[a-z0-9.]{4,20}$/.test(id)) msg = "아이디는 영문 소문자 · 숫자 · 점(.)으로 4~20자여야 합니다.";
      else if (pw.length < 8) msg = "비밀번호는 8자 이상이어야 합니다.";
      else if (pw !== $("su-pw2").value) msg = "비밀번호 확인이 일치하지 않습니다.";
      else if (!$("su-agree").checked) msg = "개인정보 수집 · 이용에 동의해야 신청할 수 있습니다.";
      $("err").textContent = msg;
      if (msg) return;
      try {
        await api("/api/auth/signup", { method: "POST", body: {
          login_id: id,
          password: pw,
          name,
          position: $("su-rank").value.trim() || null,
          phone: $("su-phone").value.trim() || null,
          org_id: Number($("su-dept").value || $("su-company").value) || null,
          role: $("su-role").value,
        } });
      } catch (err) {
        $("err").textContent = err.message;
        return;
      }
      $("done-name").textContent = name;
      $("form").hidden = true;
      $("done").hidden = false;
    });
  </script>
</body>
</html>
