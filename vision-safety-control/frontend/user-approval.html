<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0c1016" />
  <title>회원가입 승인 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>
  try { if (localStorage.getItem("safety.mode") === "light") document.documentElement.dataset.mode = "light"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="mode_change.css" />
  <style>
    .main { grid-template-rows: auto minmax(0, 1fr); }
    .req { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; }
    .req + .req { border-top: 1px solid var(--line); }
    .req h3 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
    .req dl { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 17.5px; color: var(--muted); }
    .req dt { display: inline; font-weight: 700; color: #6b7889; margin-right: 4px; }
    .req dd { display: inline; color: #c5d0dc; font-weight: 600; }
    .req .acts { display: flex; gap: 6px; align-items: center; }
    .req.done { opacity: 0.5; }
    @media (max-width: 700px) { .req { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="page no-left rail-hidden rail-over">
    <header class="cell head" data-back="users.html"></header>

    <main class="main">
      <section class="cell searchbar">
        <div class="searchbar-row">
          <input class="input" id="q" style="width:240px" placeholder="이름 · 아이디 · 소속으로 찾기" />
          <button type="button" class="btn search-toggle" data-search-toggle aria-expanded="false" aria-controls="filter">검색 조건 <em class="search-sum" hidden></em><i class="chev">▾</i></button>
          <b id="n-shown"></b>
          <span class="grow"></span>
          <a class="btn" href="signup.html">회원가입 화면 보기</a>
        </div>
        <div class="search-panel" id="filter" hidden>
          <div class="search-fields">
            <div class="field">신청 상태
              <div class="chips" id="f-status" data-single>
                <span class="chip on" data-v="PENDING">승인 대기 <b id="n-PENDING">0</b></span>
                <span class="chip" data-v="ACTIVE">승인됨 <b id="n-ACTIVE">0</b></span>
                <span class="chip" data-v="REJECTED">반려됨 <b id="n-REJECTED">0</b></span>
              </div>
            </div>
            <div class="hint">신청자는 <b>회원가입</b> 화면에서 신청합니다. 승인하면 <b>status</b>가 <b>PENDING → ACTIVE</b>로 바뀌고 <b>approved_by</b>에 승인한 관리자가 남습니다.</div>
          </div>
          <div class="row end"><button class="btn primary" type="button" data-search-close>닫기</button></div>
        </div>
      </section>
      <section class="cell" id="list"></section>
    </main>

    <button type="button" class="rail-toggle rail-right" data-rail="right" aria-controls="rail" aria-expanded="false" title="오른쪽 패널 열기">◁</button>
    <aside class="cell right" id="rail">
      <div class="pad">
        <div class="label">승인 전에 확인할 것</div>
        <div class="check info"><div><b>소속 확인</b><small>협력사 신청자는 해당 회사 담당자에게 확인</small></div><span class="status info">1</span></div>
        <div class="check info"><div><b>역할 낮춰서 부여</b><small>요청 역할보다 낮게 승인할 수 있음</small></div><span class="status info">2</span></div>
        <div class="check warn"><div><b>관리자 역할은 승인으로 못 줌</b><small>필요하면 회원정보 수정에서 따로 지정</small></div><span class="status warn">!</span></div>
      </div>
    </aside>
  </div>

  <div class="pop" id="reject-pop" hidden>
    <div class="pop-card">
      <div class="pop-head">
        <div><span class="status stop">반려</span><h2 id="reject-title">가입 반려</h2><p>반려하면 이 아이디로 로그인할 수 없습니다 (신청자에게 따로 알려 주세요)</p></div>
        <button type="button" class="x-btn" data-close title="닫기" aria-label="닫기">✕</button>
      </div>
      <div class="pop-body">
        <div class="row end"><button class="btn" data-close>취소</button><button class="btn danger" id="reject-ok">반려</button></div>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    requireLogin();
    const $ = (id) => document.getElementById(id);
    let users = [], orgs = {}, rejectId = null;

    async function load() {
      const [list, orgList] = await Promise.all([api("/api/users"), api("/api/orgs")]);
      users = list;
      orgs = orgNames(orgList);
      render();
    }

    function render() {
      ["PENDING", "ACTIVE", "REJECTED"].forEach((st) => { $("n-" + st).textContent = users.filter((u) => u.status === st).length; });
      const chip = document.querySelector("#f-status .chip.on"), tab = chip.dataset.v;
      searchSummary(chip.firstChild.textContent.trim());
      const q = $("q").value.trim().toLowerCase();
      const rows = users.filter((u) => u.status === tab)
        .filter((u) => !q || [u.name, u.login_id, orgs[u.org_id]].join(" ").toLowerCase().includes(q));
      $("n-shown").textContent = `${rows.length}건`;
      $("list").innerHTML = rows.length ? rows.map((u) => `
        <div class="req" data-id="${u.id}">
          <div>
            <h3>${esc(u.name)} ${esc(u.position || "")} ${badge("userStatus", u.status)}</h3>
            <dl><div><dt>아이디</dt><dd>${esc(u.login_id)}</dd></div><div><dt>소속</dt><dd>${esc(orgs[u.org_id] || "-")}</dd></div>
              <div><dt>${u.status === "PENDING" ? "요청 역할" : "역할"}</dt><dd>${LABEL.role[u.role][1]}</dd></div>
              <div><dt>휴대폰</dt><dd>${esc(u.phone || "-")}</dd></div><div><dt>신청</dt><dd>${fmtTime(u.created_at).slice(0, 16)}</dd></div></dl>
          </div>
          ${u.status === "PENDING" ? `<div class="acts">
            <select class="input" style="width:130px" aria-label="부여할 역할">
              <option value="MANAGER"${u.role === "MANAGER" ? " selected" : ""}>안전관리자</option>
              <option value="VIEWER"${u.role === "VIEWER" ? " selected" : ""}>조회 전용</option>
            </select>
            <button class="btn sm" data-reject>반려</button><button class="btn sm primary" data-approve>승인</button>
          </div>` : ""}
        </div>`).join("")
        : `<div class="pad muted" style="text-align:center; padding:40px">${q ? "찾는 신청이 없습니다" : "해당하는 신청이 없습니다"}</div>`;
    }

    const nameOf = (id) => users.find((u) => u.id === id).name;

    $("list").addEventListener("click", async (e) => {
      const row = e.target.closest(".req");
      if (!row) return;
      const id = Number(row.dataset.id);
      if (e.target.closest("[data-approve]")) {
        const role = row.querySelector("select").value;
        try {
          await api(`/api/users/${id}/approve`, { method: "POST", body: { role } });
          toast(`${nameOf(id)}님을 ${LABEL.role[role][1]}(으)로 승인했습니다.`);
          await load();
        } catch (err) { toast(err.message); }
      } else if (e.target.closest("[data-reject]")) {
        rejectId = id;
        $("reject-title").textContent = nameOf(id) + " 가입 반려";
        $("reject-pop").hidden = false;
      }
    });
    $("reject-ok").addEventListener("click", async () => {
      $("reject-pop").hidden = true;
      try {
        await api(`/api/users/${rejectId}/reject`, { method: "POST" });
        toast(nameOf(rejectId) + "님의 가입을 반려했습니다.");
        await load();
      } catch (err) { toast(err.message); }
    });
    $("filter").addEventListener("click", (e) => { if (e.target.closest(".chip")) render(); });
    $("q").addEventListener("input", render);

    // 다른 화면에서 ?status=PENDING&q=아이디 로 들어오면 그 탭 · 검색어로 연다
    const params = new URLSearchParams(location.search);
    const startTab = document.querySelector(`#f-status .chip[data-v="${params.get("status")}"]`);
    if (startTab) document.querySelectorAll("#f-status .chip").forEach((c) => c.classList.toggle("on", c === startTab));
    if (params.get("q")) $("q").value = params.get("q");

    load().catch((err) => toast(err.message));
  </script>
</body>
</html>
