<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>현장작업자 관리 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>
  try { if (localStorage.getItem("safety.mode") === "light") document.documentElement.dataset.mode = "light"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="mode_change.css" />
  <style>
    .main { grid-template-rows: auto auto minmax(0, 1fr); }
    .sum-strip { grid-template-columns: 150px 150px minmax(0, 1fr); }
    .tbl td { vertical-align: middle; }
    .sp { font-size: 16px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: rgba(255, 154, 31, 0.16); color: var(--orange); white-space: nowrap; }
  </style>
</head>
<body>
  <div class="page full">

    <header class="cell head"></header>

    <main class="main">
      <section class="cell sum-strip" aria-label="오늘 현황">
        <div class="kpi-box"><span>등록 작업자</span><strong id="k-all">0<i>명</i></strong></div>
        <div class="kpi-box"><span>특별관리</span><strong style="color:var(--orange)" id="k-sp">0<i>명</i></strong></div>
        <div class="sum-list" id="idle"></div>
      </section>
      <section class="cell searchbar">
        <div class="searchbar-row">
          <input class="input" id="q" style="width:220px" placeholder="이름 · 직종으로 찾기" />
          <button type="button" class="btn search-toggle" data-search-toggle aria-expanded="false" aria-controls="filter">검색 조건 <em class="search-sum" hidden></em><i class="chev">▾</i></button>
          <b id="n-shown"></b>
          <span class="grow"></span>
          <button class="btn primary" id="add" data-need="MANAGER">＋ 작업자 등록</button>
        </div>
        <div class="search-panel" id="filter" hidden>
          <div class="search-fields">
            <div class="field wide">협력사
              <div class="chips" id="f-company" data-single></div>
            </div>
            <label class="row muted" style="gap:6px; font-size:17.5px"><input type="checkbox" id="f-special" /> 특별관리 대상만</label>
            <label class="row muted" style="gap:6px; font-size:17.5px"><input type="checkbox" id="f-noedu" /> 기초안전교육 미이수만</label>
            <div class="hint">현장작업자는 로그인하지 않습니다. 작업 배정과 <b>특별관리근로자</b> 패널에 쓰입니다.</div>
          </div>
          <div class="row end"><button class="btn" type="button" id="reset">초기화</button><button class="btn primary" type="button" data-search-close>닫기</button></div>
        </div>
      </section>
      <section class="cell" style="padding:0 6px 6px">
        <table class="tbl">
          <thead><tr><th>이름</th><th>협력사</th><th>직종</th><th>연락처</th><th>특별관리</th><th>기초교육</th><th>오늘 배정 작업</th><th data-need="MANAGER"></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </main>
  </div>

  <div class="pop" id="pop" hidden>
    <div class="pop-card" style="width:min(560px, 100%)">
      <div class="pop-head">
        <div><span class="role" id="pop-tag">새 작업자</span><h2 id="pop-title">작업자 등록</h2><p>특별관리 지정은 특별관리 지정 화면에서 합니다</p></div>
        <button class="btn sm" data-close>닫기</button>
      </div>
      <form class="pop-body" id="form">
        <div class="two">
          <label class="field">이름<input class="input" id="w-name" placeholder="예: 홍길동" required /></label>
          <label class="field">협력사<input class="input" id="w-co" list="companies" placeholder="예: 대한골조" /></label>
        </div>
        <datalist id="companies"></datalist>
        <div class="two">
          <label class="field">직종<input class="input" id="w-job" placeholder="예: 형틀목공" /></label>
          <label class="field">연락처<input class="input" id="w-phone" placeholder="010-0000-0000" /></label>
        </div>
        <div class="two">
          <label class="field">생년월일<input class="input" id="w-birth" type="date" /></label>
          <label class="field">현장 투입일<input class="input" id="w-start" type="date" /></label>
        </div>
        <div class="row end"><button class="btn" type="button" data-close>취소</button><button class="btn primary">저장</button></div>
      </form>
      <div class="pop-body" id="edu-box" hidden>
        <div class="label" style="margin-top:6px">안전교육 이수 기록 <span>같은 교육을 다시 받으면 새로 추가</span></div>
        <div id="edu-list" style="display:grid; gap:6px"></div>
        <div class="row">
          <select class="input grow" id="edu-pick"></select>
          <input class="input" type="date" id="edu-date" style="width:150px" />
          <button class="btn" type="button" id="edu-add">추가</button>
        </div>
      </div>
    </div>
  </div>

  <div class="pop" id="del-pop" hidden>
    <div class="pop-card">
      <div class="pop-head">
        <div><span class="status stop">삭제</span><h2 id="del-title">작업자 삭제</h2><p>끝나지 않은 작업 배정과 장비 운전원에서도 함께 빠집니다</p></div>
        <button class="btn sm" data-close>닫기</button>
      </div>
      <div class="row end" style="margin-top:14px"><button class="btn" data-close>취소</button><button class="btn danger" id="del-ok">삭제</button></div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    requireLogin();
    const $ = (id) => document.getElementById(id);
    let workers = [], edus = [], editId = null, delId = null;

    async function load() {
      [workers, edus] = await Promise.all([api("/api/workers"), edus.length ? edus : api("/api/educations")]);
      const companies = [...new Set(workers.map((w) => w.company).filter(Boolean))].sort();
      const picked = document.querySelector("#f-company .chip.on");
      const keep = picked ? picked.dataset.v : "";
      $("f-company").innerHTML = [["", "전체", workers.length], ...companies.map((c) => [c, c, workers.filter((w) => w.company === c).length])]
        .map(([v, t, n]) => `<span class="chip${v === keep ? " on" : ""}" data-v="${esc(v)}">${esc(t)} <b>${n}</b></span>`).join("");
      if (!document.querySelector("#f-company .chip.on")) $("f-company").firstElementChild.classList.add("on");
      $("companies").innerHTML = companies.map((c) => `<option value="${esc(c)}">`).join("");
      $("edu-pick").innerHTML = edus.map((e) => `<option value="${e.id}">${e.edu_type === "GENERAL" ? "[기초] " : ""}${esc(e.name)}</option>`).join("");
      render();
    }

    function render() {
      const q = $("q").value.trim(), company = document.querySelector("#f-company .chip.on").dataset.v;
      const onlySp = $("f-special").checked, onlyNoEdu = $("f-noedu").checked;
      searchSummary([company, onlySp && "특별관리만", onlyNoEdu && "교육 미이수만"].filter(Boolean).join(" · "));
      const rows = workers.filter((w) => (!company || w.company === company) && (!onlySp || w.special_tags.length)
        && (!onlyNoEdu || !w.general_edu) && (!q || (w.name + " " + (w.job_type || "")).includes(q)));
      $("n-shown").textContent = rows.length + "명";
      $("rows").innerHTML = rows.length ? rows.map((w) => `
        <tr data-id="${w.id}"><td><b>${esc(w.name)}</b></td><td>${esc(w.company || "-")}</td><td>${esc(w.job_type || "-")}</td>
          <td class="num">${esc(w.phone || "-")}</td><td>${spTags(w)}</td>
          <td>${w.general_edu ? '<span class="status ok">이수</span>' : '<span class="status stop">미이수</span>'}</td>
          <td>${w.today_work ? esc(w.today_work.name) : '<span class="muted">배정 없음</span>'}</td>
          <td data-need="MANAGER"><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-edit>수정</button><button class="btn sm" data-del>삭제</button></div></td></tr>`).join("")
        : '<tr><td colspan="8" class="muted" style="text-align:center; padding:28px">해당하는 작업자가 없습니다</td></tr>';

      $("k-all").innerHTML = `${workers.length}<i>명</i>`;
      $("k-sp").innerHTML = `${workers.filter((w) => w.special_tags.length).length}<i>명</i>`;
      const idle = workers.filter((w) => w.general_edu && !w.today_work);
      $("idle").innerHTML = idle.length
        ? `<div class="check warn"><div><b>오늘 배정 없는 작업자 ${idle.length}명</b><small>${idle.slice(0, 4).map((w) => esc(w.name)).join(", ")}${idle.length > 4 ? " 외" : ""}</small></div><a class="btn sm" href="works.html" data-need="MANAGER">배정</a></div>`
        : '<div class="check"><div><b>모든 작업자 배정됨</b><small>오늘 배정 없는 작업자가 없습니다</small></div></div>';
    }

    function openForm(w) {
      editId = w ? w.id : null;
      $("pop-tag").textContent = w ? "수정" : "새 작업자";
      $("pop-title").textContent = w ? `${w.name} 수정` : "작업자 등록";
      $("w-name").value = w ? w.name : "";
      $("w-co").value = w ? w.company || "" : "";
      $("w-job").value = w ? w.job_type || "" : "";
      $("w-phone").value = w ? w.phone || "" : "";
      $("w-birth").value = w ? w.birth_date || "" : "";
      $("w-start").value = w ? w.start_date || "" : todayStr();
      $("edu-box").hidden = !w;
      $("edu-date").value = todayStr();
      if (w) renderEdu(w);
      $("pop").hidden = false;
      $("w-name").focus();
    }

    function renderEdu(w) {
      $("edu-list").innerHTML = w.educations.length ? w.educations.map((e) => `
        <div class="check${e.edu_type === "GENERAL" ? "" : " info"}"><div><b>${esc(e.name)}</b><small>${e.edu_type === "GENERAL" ? "기초안전보건교육" : "특별교육"} · ${fmtTime(e.completed_date + "T", { time: false })} 이수</small></div>
          <button class="btn sm" type="button" data-edu-del="${e.id}">삭제</button></div>`).join("")
        : '<div class="hint">아직 이수한 교육이 없습니다. 기초교육 <b>이수</b>는 근로자 정기안전보건교육, 건설업 기초안전보건교육, 채용 시 교육, 작업내용 변경 시 교육을 모두 등록했을 때만 됩니다.</div>';
    }

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = {
        name: $("w-name").value.trim(), company: $("w-co").value.trim() || null, job_type: $("w-job").value.trim() || null,
        phone: $("w-phone").value.trim() || null, birth_date: $("w-birth").value || null, start_date: $("w-start").value || null,
      };
      try {
        const saved = editId
          ? await api(`/api/workers/${editId}`, { method: "PATCH", body })
          : await api("/api/workers", { method: "POST", body });
        toast(editId ? `${saved.name} 정보를 저장했습니다.` : `${saved.name} 작업자를 등록했습니다. 안전교육 기록을 추가하세요.`);
        await load();
        openForm(workers.find((w) => w.id === saved.id)); // 등록 후 바로 교육 기록을 넣을 수 있게
      } catch (err) { toast(err.message); }
    });

    $("edu-add").addEventListener("click", async () => {
      try {
        const w = await api(`/api/workers/${editId}/educations`, { method: "POST", body: { edu_id: Number($("edu-pick").value), completed_date: $("edu-date").value } });
        renderEdu(w);
        toast("교육 이수 기록을 추가했습니다.");
        await load();
      } catch (err) { toast(err.message); }
    });
    $("edu-list").addEventListener("click", async (e) => {
      const b = e.target.closest("[data-edu-del]");
      if (!b) return;
      try {
        renderEdu(await api(`/api/workers/${editId}/educations/${b.dataset.eduDel}`, { method: "DELETE" }));
        await load();
      } catch (err) { toast(err.message); }
    });

    $("rows").addEventListener("click", (e) => {
      const tr = e.target.closest("tr[data-id]");
      if (!tr) return;
      const w = workers.find((x) => x.id === Number(tr.dataset.id));
      if (e.target.closest("[data-edit]")) openForm(w);
      if (e.target.closest("[data-del]")) { delId = w.id; $("del-title").textContent = `${w.name} 삭제`; $("del-pop").hidden = false; }
    });
    $("del-ok").addEventListener("click", async () => {
      $("del-pop").hidden = true;
      try {
        await api(`/api/workers/${delId}`, { method: "DELETE" });
        toast("작업자를 삭제했습니다.");
        await load();
      } catch (err) { toast(err.message); }
    });

    $("add").addEventListener("click", () => openForm(null));
    $("q").addEventListener("input", render);
    $("filter").addEventListener("click", (e) => { if (e.target.closest(".chip")) render(); });
    $("f-company").addEventListener("click", (e) => {
      // 협력사 칩은 나중에 그려서 common.js 가 모르므로 여기서 하나만 켠다
      const chip = e.target.closest(".chip");
      if (!chip) return;
      $("f-company").querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c === chip));
    });
    ["f-special", "f-noedu"].forEach((id) => $(id).addEventListener("change", render));
    $("reset").addEventListener("click", () => {
      $("f-company").querySelectorAll(".chip").forEach((c, i) => c.classList.toggle("on", i === 0));
      $("f-special").checked = $("f-noedu").checked = false;
      render();
    });

    load().catch((err) => toast(err.message));
  </script>
</body>
</html>
