<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>작업별 장비 · 작업자 목록 · 안전관제</title>
  <script>
    // 구역별 투입장비 목록은 작업별 장비 · 작업자 목록(work-workers.html)으로 합쳤다. 예전 주소 · 즐겨찾기는 그쪽으로 보낸다
    const zone = new URLSearchParams(location.search).get("zone");
    location.replace("work-workers.html" + (zone ? "?zone=" + encodeURIComponent(zone) : ""));
  </script>
</head>
<body>
  <p><a href="work-workers.html">작업별 장비 · 작업자 목록으로 이동</a></p>
</body>
</html>
