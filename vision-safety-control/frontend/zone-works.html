<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>구역별 작업 목록 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="common.css" />
  <style>
    .main { grid-template-rows: auto minmax(0, 1fr); }
    .zone-sum { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, auto); gap: 18px; align-items: center; padding: 14px 18px; }
    .zone-sum h2 { font-size: 19px; letter-spacing: -0.03em; }
    .zone-sum .muted { margin-top: 2px; }
    .zone-sum div > span { display: block; font-size: 11px; color: var(--muted); font-weight: 700; }
    .zone-sum div > b { font-size: 20px; font-variant-numeric: tabular-nums; }
    @media (max-width: 1100px) { .zone-sum { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="page">
    <aside class="cell left">
      <div class="pad" id="zones">
        <div class="label">작업구역 <span id="n-zones">0곳</span></div>
      </div>
    </aside>

    <header class="cell head"></header>

    <main class="main">
      <section class="cell zone-sum">
        <div><h2 id="zname">-</h2><p class="muted" id="zsub">-</p></div>
        <div><span>작업</span><b id="zwork">0</b></div>
        <div><span>배정 인원</span><b id="zpeople">0</b></div>
        <div><span>특별관리</span><b id="zsp" style="color:var(--orange)">0</b></div>
      </section>
      <section class="cell" style="padding:0 6px 6px">
        <table class="tbl">
          <thead><tr><th>번호</th><th>작업</th><th>담당 안전관리자</th><th>기간</th><th>인원</th><th>상태</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </main>

    <aside class="cell right">
      <div class="pad">
        <div class="label">이 화면은</div>
        <div class="hint">작업구역 하나를 고르면 그 구역에서 진행 중이거나 예정된 <b>작업</b>을 보여 줍니다. 줄을 누르면 <b>작업별 작업자 목록</b>으로 이동합니다.</div>
        <a class="btn block" href="zones.html">← 전체 구역 표시</a>
        <a class="btn block" id="to-eq" href="zone-equipment.html">이 구역 투입장비 →</a>
        <a class="btn primary block" href="works.html" data-need="MANAGER">작업 등록 및 배정 →</a>
      </div>
    </aside>
  </div>
  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    requireLogin();
    const $ = (id) => document.getElementById(id);
    let zones = [], works = [];

    function show(zoneId) {
      const z = zones.find((x) => x.id === zoneId) || zones[0];
      if (!z) return;
      history.replaceState(null, "", "?zone=" + z.id);
      document.querySelectorAll("#zones .tc-card").forEach((c) => c.classList.toggle("active", Number(c.dataset.z) === z.id));
      const list = works.filter((w) => w.work_zone_id === z.id);
      $("zname").textContent = z.name;
      $("zsub").textContent = [...z.equipment.filter((e) => e.kind === "TC").map((e) => e.name.split(" · ")[0]), ...z.cameras].join(" · ") || "카메라 · TC 없음";
      $("zwork").textContent = list.length;
      $("zpeople").textContent = list.reduce((a, w) => a + w.worker_count, 0);
      $("zsp").textContent = list.reduce((a, w) => a + w.special_count, 0);
      $("rows").innerHTML = list.length ? list.map((w) => `
        <tr data-href="work-workers.html?id=${w.id}" style="cursor:pointer"><td class="num">W-${pad2(w.id)}</td><td><b>${esc(w.name)}</b></td>
          <td>${esc(w.manager_name || "-")}</td><td class="num">${period(w)}</td><td class="num">${w.worker_count}명</td>
          <td>${badge("workStatus", w.status)}</td><td><a class="btn sm" href="work-workers.html?id=${w.id}">작업자 보기</a></td></tr>`).join("")
        : '<tr><td colspan="7" class="muted" style="text-align:center; padding:28px">이 구역에 진행 · 예정 작업이 없습니다</td></tr>';
      $("rows").querySelectorAll("tr[data-href]").forEach((tr) => tr.addEventListener("click", (e) => { if (!e.target.closest("a")) location.href = tr.dataset.href; }));
      $("to-eq").href = "zone-equipment.html?zone=" + z.id;
    }

    $("zones").addEventListener("click", (e) => { const c = e.target.closest(".tc-card"); if (c) show(Number(c.dataset.z)); });

    (async () => {
      [zones, works] = await Promise.all([api("/api/work-zones/summary"), api("/api/works", { query: { upcoming: true } })]);
      $("n-zones").textContent = zones.length + "곳";
      $("zones").insertAdjacentHTML("beforeend", zones.map((z) => {
        const n = works.filter((w) => w.work_zone_id === z.id).length;
        const sub = [...z.equipment.filter((e) => e.kind === "TC").map((e) => e.name.split(" · ")[0]), ...z.cameras.slice(0, 1)].join(" · ");
        return `<button class="tc-card" data-z="${z.id}"><strong>${esc(z.name)} <span class="muted">${n}</span></strong><p>${esc(sub || "-")}</p></button>`;
      }).join(""));
      show(Number(new URLSearchParams(location.search).get("zone")));
    })().catch((err) => toast(err.message));
  </script>
</body>
</html>
