<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0c1016" />
  <title>구역별 작업 목록 · 안전관제</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>
  try { if (localStorage.getItem("safety.mode") === "light") document.documentElement.dataset.mode = "light"; } catch (e) {}
  try { const z = Number(localStorage.getItem("safety.text-zoom")); if (z) document.documentElement.style.setProperty("--text-zoom", z); } catch (e) {}
  </script>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="mode_change.css" />
  <style>
    .main { grid-template-rows: auto auto minmax(0, 1fr); }
    .zone-sum { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, auto); gap: 18px; align-items: center; padding: 14px 18px; }
    .zone-sum h2 { font-size: 24px; letter-spacing: -0.03em; }
    .zone-sum .muted { margin-top: 2px; }
    .zone-sum div > span { display: block; font-size: 16px; color: var(--muted); font-weight: 700; }
    .zone-sum div > b { font-size: 25px; font-variant-numeric: tabular-nums; }
    .zone-pick { width: min(360px, 100%); color-scheme: dark; }
    @media (max-width: 1100px) { .zone-sum { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="page no-left rail-hidden rail-over">
    <header class="cell head" data-back="zones.html">
      <div class="head-acts"><a class="btn" id="to-eq" href="work-workers.html">이 구역 장비 · 작업자</a><a class="btn primary" href="works.html" data-need="MANAGER">＋ 작업 등록 · 배정</a></div>
    </header>

    <main class="main">
      <section class="cell">
        <div class="searchbar-row">
          <select id="zone-pick" class="input zone-pick" aria-label="작업구역"></select>
          <span class="muted" id="n-zones">0곳</span>
        </div>
      </section>
      <section class="cell zone-sum">
        <div><h2 id="zname">-</h2><p class="muted" id="zsub">-</p></div>
        <div><span>작업</span><b id="zwork">0</b></div>
        <div><span>배정 인원</span><b id="zpeople">0</b></div>
        <div><span>특별관리</span><b id="zsp" style="color:var(--orange)">0</b></div>
      </section>
      <section class="cell" style="padding:0 6px 6px">
        <table class="tbl">
          <thead><tr><th>번호</th><th>작업</th><th>담당 안전관리자</th><th>기간</th><th>인원</th><th>상태</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </main>

    <button type="button" class="rail-toggle rail-right" data-rail="right" aria-controls="rail" aria-expanded="false" title="오른쪽 패널 열기">◁</button>
    <aside class="cell right" id="rail">
      <div class="pad">
        <div class="label">이 화면은</div>
        <div class="hint">위의 [작업구역]에서 구역 하나를 고르면 그 구역에서 진행 중이거나 예정된 <b>작업</b>을 보여 줍니다. 줄을 누르면 <b>작업별 장비 · 작업자 목록</b>으로 이동합니다.</div>
      </div>
    </aside>
  </div>
  <script src="api.js"></script>
  <script src="common.js"></script>
  <script>
    requireLogin();
    const $ = (id) => document.getElementById(id);
    let zones = [], works = [];

    function show(zoneId) {
      const z = zones.find((x) => x.id === zoneId) || zones[0];
      if (!z) return;
      history.replaceState(null, "", "?zone=" + z.id);
      if ($("zone-pick").value !== String(z.id)) $("zone-pick").value = String(z.id);
      const list = works.filter((w) => w.work_zone_id === z.id);
      $("zname").textContent = z.name;
      $("zsub").textContent = [...z.equipment.filter((e) => e.kind === "TC").map((e) => e.name.split(" · ")[0]), ...z.cameras].join(" · ") || "카메라 · TC 없음";
      $("zwork").textContent = list.length;
      $("zpeople").textContent = list.reduce((a, w) => a + w.worker_count, 0);
      $("zsp").textContent = list.reduce((a, w) => a + w.special_count, 0);
      $("rows").innerHTML = list.length ? list.map((w) => `
        <tr data-href="work-workers.html?id=${w.id}" style="cursor:pointer"><td class="num">W-${pad2(w.id)}</td><td><b>${esc(w.name)}</b></td>
          <td>${esc(w.manager_name || "-")}</td><td class="num">${period(w)}</td><td class="num">${w.worker_count}명</td>
          <td>${badge("workStatus", w.status)}</td><td><a class="btn sm" href="work-workers.html?id=${w.id}">장비 · 작업자 보기</a></td></tr>`).join("")
        : '<tr><td colspan="7" class="muted" style="text-align:center; padding:28px">이 구역에 진행 · 예정 작업이 없습니다</td></tr>';
      $("rows").querySelectorAll("tr[data-href]").forEach((tr) => tr.addEventListener("click", (e) => { if (!e.target.closest("a")) location.href = tr.dataset.href; }));
      $("to-eq").href = "work-workers.html?zone=" + z.id;
    }

    $("zone-pick").addEventListener("change", () => show(Number($("zone-pick").value)));

    (async () => {
      [zones, works] = await Promise.all([api("/api/work-zones/summary"), api("/api/works", { query: { upcoming: true } })]);
      $("n-zones").textContent = zones.length + "곳";
      $("zone-pick").innerHTML = zones.length ? zones.map((z) => {
        const n = works.filter((w) => w.work_zone_id === z.id).length;
        return `<option value="${z.id}">${esc(z.name)} · 작업 ${n}</option>`;
      }).join("") : `<option value="" disabled>등록된 작업구역이 없습니다</option>`;
      show(Number(new URLSearchParams(location.search).get("zone")));
    })().catch((err) => toast(err.message));
  </script>
</body>
</html>
